<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>moneda - Gestión Financiera & Transporte</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-color: #0f1012;
      --card-bg: #1e1e1e;
      --card-border: #2a2a2a;
      --text-main: #f0f0f0;
      --text-secondary: #a0a0a0;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --accent-orange: #f97316;
      --sidebar-width: 240px;
    }

    [data-theme="light"] {
      --bg-color: #f4f5f7;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-secondary: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; min-height: 100vh; overflow-x: hidden; }

    /* App Header */
    .app-header { position: fixed; top: 0; left: 0; right: 0; height: 56px; background-color: var(--card-bg); border-bottom: 1px solid var(--card-border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 100; }
    .header-title { font-size: 18px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
    .sync-badge { font-size: 12px; padding: 4px 10px; border-radius: 12px; background: rgba(34, 197, 94, 0.15); color: var(--accent-green); display: flex; align-items: center; gap: 6px; font-weight: 600; }

    /* Layout Responsive */
    .app-container { display: flex; width: 100%; margin-top: 56px; margin-bottom: 60px; }
    .sidebar { width: var(--sidebar-width); background: var(--card-bg); border-right: 1px solid var(--card-border); display: none; flex-direction: column; padding: 16px 0; position: fixed; top: 56px; bottom: 0; left: 0; z-index: 90; }
    .main-content { flex: 1; padding: 16px; max-width: 900px; margin: 0 auto; width: 100%; }

    /* Nav Items */
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer; border-left: 3px solid transparent; transition: all 0.2s; }
    .nav-item.active { color: var(--accent-green); background: rgba(34, 197, 94, 0.08); border-left-color: var(--accent-green); }

    /* Bottom Navigation Mobile */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--card-bg); border-top: 1px solid var(--card-border); display: flex; justify-around: space-around; align-items: center; z-index: 100; }
    .bottom-nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-secondary); text-decoration: none; font-size: 10px; font-weight: 500; cursor: pointer; }
    .bottom-nav-item.active { color: var(--accent-green); }
    .fab-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--accent-green); color: #fff; border: none; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4); margin-top: -18px; }

    @media (min-width: 768px) {
      .sidebar { display: flex; }
      .main-content { margin-left: var(--sidebar-width); }
      .bottom-nav { display: none; }
      .app-container { margin-bottom: 0; }
    }

    /* Cards & Components */
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .balance-val { font-size: 32px; font-weight: 800; margin: 8px 0; }
    .val-green { color: var(--accent-green); }
    .val-red { color: var(--accent-red); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

    input, select, textarea { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--card-border); background: rgba(0,0,0,0.2); color: var(--text-main); font-size: 14px; margin-bottom: 10px; }
    [data-theme="light"] input, [data-theme="light"] select { background: #f8fafc; }

    .btn { padding: 10px 16px; border-radius: 8px; border: none; font-weight: 600; font-size: 14px; cursor: pointer; transition: opacity 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-green { background: var(--accent-green); color: #fff; }
    .btn-red { background: var(--accent-red); color: #fff; }
    .btn-flat { background: rgba(255,255,255,0.06); color: var(--text-main); border: 1px solid var(--card-border); }
    .btn-flat:hover { background: rgba(255,255,255,0.12); }

    .chip-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip { padding: 6px 12px; border-radius: 20px; background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .chip.active { background: var(--accent-green); color: #fff; border-color: var(--accent-green); }

    /* Tabs Visibility */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Lists & Items */
    .history-item { padding: 12px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .badge { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
    .badge-paid { background: rgba(34, 197, 94, 0.15); color: var(--accent-green); }
    .badge-pending { background: rgba(249, 115, 22, 0.15); color: var(--accent-orange); }
    .badge-late { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }
  </style>
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-title">
      <span>🪙 moneda</span>
    </div>
    <div class="sync-badge" id="syncIndicator">
      <span id="syncIcon">☁️</span> <span id="syncText">Sincronizado</span>
    </div>
  </header>

  <div class="app-container">
    <!-- Sidebar Desktop -->
    <nav class="sidebar">
      <div class="nav-item active" id="snav
