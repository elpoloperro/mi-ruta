<meta name="theme-color" content="#c98a2c">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --paper: #f6f4ee;
    --paper-line: #e3ddc9;
    --ink: #1f2a24;
    --ink-soft: #5b6b60;
    --coin: #c98a2c;
    --coin-soft: #f0d9ae;
    --ok: #3f7a5c;
    --warn: #c98a2c;
    --danger: #b8462f;
    --income: #2f7a5c;
    --card: #ffffff;
    --shadow-ink: #1f2a24;
  }
  html[data-theme="dark"]{
    --paper: #14181a;
    --paper-line: #262e30;
    --ink: #eae6da;
    --ink-soft: #8a9490;
    --coin: #e0a458;
    --coin-soft: #3a2f1c;
    --ok: #5aa483;
    --warn: #e0a458;
    --danger: #d97060;
    --income: #5aa483;
    --card: #1c2224;
    --shadow-ink: #e0a458;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      repeating-linear-gradient(180deg, transparent, transparent 35px, var(--paper-line) 35px, var(--paper-line) 36px);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    padding:0 0 60px 0;
    transition:background-color .25s ease, color .25s ease;
  }

  .wrap{ max-width:560px; margin:0 auto; padding:28px 18px 0 18px; }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
    border-bottom:2px solid var(--ink);
    padding-bottom:12px;
  }
  header h1{ font-size:26px; margin:0; letter-spacing:-0.02em; }
  header h1 span{ color:var(--coin); }
  .theme-toggle{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:20px;
    width:38px; height:38px;
    cursor:pointer;
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
    transition:background-color .25s ease, border-color .25s ease;
  }
  .sync-status{
    font-family:'JetBrains Mono', monospace; font-size:14px; line-height:1;
    display:inline-flex; align-items:center; opacity:0.85;
  }

  .month-nav{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .month-nav button{
    background:var(--card); border:1px solid var(--paper-line); border-radius:8px;
    width:30px; height:30px; cursor:pointer; font-size:14px; color:var(--ink);
    transition:background-color .25s ease, border-color .25s ease;
  }
  .month-nav button:disabled{ opacity:0.3; cursor:default; }

  /* Chat-style input */

    font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-soft);

  .export-btn{ background:var(--card); border:1px solid var(--paper-line); border-radius:8px; padding:8px 12px; font-size:13px; cursor:pointer; color:var(--ink); white-space:nowrap; }

    header h1{ font-size:22px; }
    .summary{ flex-wrap:wrap; }
    .summary-card{ min-width:45%; }

<div class="wrap">
  <header>
    <div style="display:flex;align-items:center;gap:8px;">
      <h1>moneda<span>.</span></h1>
      <span class="sync-status" id="syncStatus" title="Tocá para forzar una actualización desde la nube"></span>

  <div class="month-nav">

  <div id="banners"></div>

      <datalist id="rawHistory"></datalist>

      <input type="date" id="composerDate">
    </div>
    <div class="parse-preview" id="preview"></div>
    <div class="hint">Probá: "1200 nafta" · "cobré 200k de sueldo" · "3k5 super" · tocá el micrófono para dictar</div>
  </div>

  <div class="section-title">
    <span>Botones rápidos</span>
    <span class="add-link" id="toggleNewQuick">+ botón</span>
  </div>
  <div class="new-cat-row" id="newQuickRow" style="display:none;">

<script>
(function(){
  const DEFAULT_CATS = [
    { key:'comida', label:'Comida', icon:'🍽️', words:['comida','super','supermercado','almuerzo','cena','restaurante','delivery','pedidos ya','rappi','panaderia','carniceria','verduleria','comi','almorc'], budget:50000, builtin:true },

    { key:'servicios', label:'Servicios', icon:'💡', words:['servicio','luz','gas','agua','internet','wifi','telefono','celular'], budget:40000, builtin:true },
    { key:'entretenimiento', label:'Entretenimiento', icon:'🎬', words:['entretenimiento','cine','salida','bar','boliche','juego','videojuego','streaming','recital','teatro'], budget:15000, builtin:true },
    { key:'salud', label:'Salud', icon:'💊', words:['salud','farmacia','medico','remedio','medicamento','doctor','dentista','obra social'], budget:15000, builtin:true },

  const SUGGESTED_NEW_CATS = [
    { key:'vivienda', label:'Vivienda', icon:'🏠', words:['alquiler','expensas','hipoteca','vivienda','arriendo'], budget:0, builtin:false },
    { key:'vehiculo', label:'Vehículo', icon:'🚗', words:['patente','cubiertas','neumatico','taller mecanico','vtv','seguro del auto','seguro vehicular','cambio de aceite','collabus'], budget:0, builtin:false },
    { key:'suscripciones', label:'Suscripciones', icon:'📺', words:['suscripcion','netflix','spotify','disney','hbo','youtube premium','amazon prime','icloud','google one'], budget:0, builtin:false },
    { key:'ropa_cuidado', label:'Ropa y cuidado personal', icon:'👕', words:['ropa','indumentaria','peluqueria','corte de pelo','cosmetica','zapatillas','manicura'], budget:0, builtin:false },
    { key:'educacion', label:'Educación', icon:'📚', words:['curso','capacitacion','libro','educacion','universidad','colegio','matricula'], budget:0, builtin:false },
    { key:'mascotas', label:'Mascotas', icon:'🐾', words:['mascota','veterinario','alimento balanceado','petshop'], budget:0, builtin:false },
    { key:'regalos', label:'Regalos y ocasiones', icon:'🎁', words:['regalo','cumpleanos','cumple','aniversario'], budget:0, builtin:false },
    { key:'deudas', label:'Deudas/tarjeta', icon:'💳', words:['tarjeta','cuota','interes','deuda','prestamo','credito'], budget:0, builtin:false },
    { key:'herramientas', label:'Herramientas de trabajo', icon:'🧰', words:['herramienta','insumos','bolsa termica','uniforme trabajo','equipo trabajo'], budget:0, builtin:false }
  ];
  const INCOME_WORDS = ['cobre','cobré','cobro','ingreso','sueldo','salario','deposito','depósito','me pagaron','freelance','venta','vendi','vendí','honorario','reintegro','devolucion','devolución'];
  const PALETTE = ['#c98a2c','#3f7a5c','#b8462f','#4c6ea8','#8a5aa8','#a8834c','#5c9ba0','#a85c7a','#6b8a3f','#8a6b3f'];
  const SYNC_URL = 'https://script.google.com/macros/s/AKfycbyAPJ15SDBDwfrtJ2WA3Z0hOPHac9lNI7_Os5MY9GPJ4baonhWiFQ0Z4QKnT5CuFwQh/exec';

  let movements = [];
  let categories = [];
  let viewDate = new Date();
  let recognizing = false;
  let recognition = null;
  let syncTimer = null;
  let syncInFlight = false;
  let expandedDays = null; // Set de dayKeys expandidos; null = todavía no inicializado
  let openKwPanel = null; // key de la categoría cuyo panel de palabras clave está abierto

  const monthLabelEl = document.getElementById('monthLabel');
  const catsEl = document.getElementById('categories');

  const totalExpenseEl = document.getElementById('totalExpense');
  const totalIncomeEl = document.getElementById('totalIncome');
  const totalBalanceEl = document.getElementById('totalBalance');

  const composerNote = document.getElementById('composerNote');

  const filterCat = document.getElementById('filterCat');

  const filterTotalEl = document.getElementById('filterTotal');
  const exportBtn = document.getElementById('exportBtn');

  const catSectionBody = document.getElementById('catSectionBody');
  const catSectionCaret = document.getElementById('catSectionCaret');
  const catSummary = document.getElementById('catSummary');
  const bannersEl = document.getElementById('banners');
  const suggestionsWrap = document.getElementById('suggestionsWrap');
  const pieChartEl = document.getElementById('pieChart');
  const trendChartEl = document.getElementById('trendChart');
  const themeToggle = document.getElementById('themeToggle');
  const backupBtn = document.getElementById('backupBtn');
  const toggleNewQuick = document.getElementById('toggleNewQuick');
  const newQuickRow = document.getElementById('newQuickRow');
  const addQuickBtn = document.getElementById('addQuickBtn');
  const quickButtonsWrap = document.getElementById('quickButtonsWrap');
  const quickConfirmWrap = document.getElementById('quickConfirmWrap');
  const confirmModalWrap = document.getElementById('confirmModalWrap');

  function openConfirmModal(title, text, onConfirm){
    confirmModalWrap.innerHTML = `
      <div class="modal-overlay">
        <div class="modal-card">
          <div class="modal-title">${title}</div>
          <div class="modal-text">${text}</div>
          <div class="modal-btns">
            <button class="modal-btn-cancel" id="modalCancelBtn">Cancelar</button>
            <button class="modal-btn-danger" id="modalOkBtn">Eliminar</button>
          </div>
        </div>
      </div>
    `;
    document.getElementById('modalCancelBtn').addEventListener('click', () => { confirmModalWrap.innerHTML = ''; });
    confirmModalWrap.querySelector('.modal-overlay').addEventListener('click', (e) => { if(e.target.classList.contains('modal-overlay')) confirmModalWrap.innerHTML = ''; });
    document.getElementById('modalOkBtn').addEventListener('click', () => { confirmModalWrap.innerHTML = ''; onConfirm(); });
  }
  const rawHistoryEl = document.getElementById('rawHistory');
  let quickButtons = [];
  const restoreFile = document.getElementById('restoreFile');

  function monthKeyOf(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
  function fmt(n){ const sign = n < 0 ? '-' : ''; return sign + '$' + Math.round(Math.abs(n)).toLocaleString('es-AR'); }
  function monthLabel(d){
    const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    return meses[d.getMonth()] + ' ' + d.getFullYear();
  }
  function todayKey(){ return new Date().toISOString().slice(0,10); }
  function catColor(key){
    const idx = categories.findIndex(c => c.key === key);
    return PALETTE[idx % PALETTE.length] || '#999';
  }
  function findCategory(key){ return categories.find(c => c.key === key) || categories[categories.length-1]; }

  function normalize(str){
    return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }
  function detectCategory(text){
    const norm = normalize(text);
    for(const cat of categories){
      if(cat.key === 'otros') continue;
      for(const w of (cat.words||[])){ if(norm.includes(normalize(w))) return cat.key; }
    }
    return 'otros';
  }
  function detectIsIncome(text){
    const norm = normalize(text);
    return INCOME_WORDS.some(w => norm.includes(normalize(w)));
  }
  function parseAmount(text){
    const milMatch = text.match(/(\d+(?:[.,]\d+)?)\s*mil\s*(\d+)?/i);
    if(milMatch){
      let base = parseFloat(milMatch[1].replace(',', '.'));
      let extra = milMatch[2] ? parseInt(milMatch[2]) * (milMatch[2].length === 1 ? 100 : 1) : 0;
      return base * 1000 + extra;
    }
    const kMatch = text.match(/(\d+(?:[.,]\d+)?)\s*k\s*(\d+)?/i);
    if(kMatch){
      let base = parseFloat(kMatch[1].replace(',', '.'));
      let extra = kMatch[2] ? parseInt(kMatch[2]) * (kMatch[2].length === 1 ? 100 : 1) : 0;
      return base * 1000 + extra;
    }
    const numMatch = text.match(/(\d{1,3}(?:[.,]\d{3})+(?:[.,]\d+)?|\d+(?:[.,]\d+)?)/);
    if(!numMatch) return null;
    let raw = numMatch[1];
    const hasDot = raw.includes('.');
    const hasComma = raw.includes(',');
    if(hasDot && hasComma){
      // el que aparece último es el separador decimal; el otro es de miles
      if(raw.lastIndexOf(',') > raw.lastIndexOf('.')){ raw = raw.replace(/\./g,'').replace(',', '.'); }
      else { raw = raw.replace(/,/g,''); }
    } else if(hasComma && !hasDot){
      // coma sola: de miles si son grupos de 3 dígitos, sino decimal
      raw = /^\d{1,3}(,\d{3})+$/.test(raw) ? raw.replace(/,/g,'') : raw.replace(',', '.');
    } else if(hasDot && !hasComma){
      // punto solo: de miles si son grupos de 3 dígitos, sino decimal
      raw = /^\d{1,3}(\.\d{3})+$/.test(raw) ? raw.replace(/\./g,'') : raw;
    }
    const val = parseFloat(raw);
    return isNaN(val) ? null : val;
  }
  function parseMessage(text){
    const amount = parseAmount(text);
    if(amount === null || amount <= 0) return null;
    const category = detectCategory(text);
    const isIncome = detectIsIncome(text);
    return { amount, category, raw: text.trim(), isIncome };
  }

  async function loadData(){
    try{ const m = localStorage.getItem('moneda_movements'); movements = m ? JSON.parse(m) : []; }
    catch(e){ movements = []; }
    try{ const c = localStorage.getItem('moneda_categories'); categories = c ? JSON.parse(c) : JSON.parse(JSON.stringify(DEFAULT_CATS)); }
    catch(e){ categories = JSON.parse(JSON.stringify(DEFAULT_CATS)); }
    try{ const t = localStorage.getItem('moneda_theme'); if(t === 'dark'){ document.documentElement.setAttribute('data-theme','dark'); themeToggle.textContent = '☀️'; } }
    catch(e){}
    try{ const q = localStorage.getItem('moneda_quickbuttons'); quickButtons = q ? JSON.parse(q) : []; }
    catch(e){ quickButtons = []; }
    await applyCategoryUpgrades();
    await pullFromCloud();
    populateFilterOptions();
    renderBanners();
    render();
    renderQuickButtons();
    updateRawHistory();
    composerDate.value = new Date().toISOString().slice(0,10);
    setCatSectionOpen(false);
  }

  // ---- Sincronización con Google Sheets ----
  function setSyncStatus(state){
    const el = document.getElementById('syncStatus');
    if(!el) return;
    if(state === 'syncing'){ el.textContent = '🔄'; el.title = 'Sincronizando...'; }
    else if(state === 'ok'){ el.textContent = '☁️'; el.title = 'Sincronizado'; }
    else if(state === 'offline'){ el.textContent = '⚠️'; el.title = 'Sin conexión: el cambio quedó guardado solo en este dispositivo por ahora'; }
  }

  async function pullFromCloud(){
    if(!SYNC_URL) return false;
    setSyncStatus('syncing');
    try{
      const res = await fetch(SYNC_URL + '?_=' + Date.now(), { method:'GET', cache:'no-store' });
      if(!res.ok) throw new Error('bad status');
      const cloud = await res.json();
      const localUpdatedAt = localStorage.getItem('moneda_updated_at') || '';
      if(cloud && cloud.updatedAt && (!localUpdatedAt || cloud.updatedAt > localUpdatedAt)){
        movements = Array.isArray(cloud.movements) ? cloud.movements : movements;
        if(Array.isArray(cloud.categories) && cloud.categories.length) categories = cloud.categories;
        quickButtons = Array.isArray(cloud.quickButtons) ? cloud.quickButtons : quickButtons;
        try{
          localStorage.setItem('moneda_movements', JSON.stringify(movements));
          localStorage.setItem('moneda_categories', JSON.stringify(categories));
          localStorage.setItem('moneda_quickbuttons', JSON.stringify(quickButtons));
          localStorage.setItem('moneda_updated_at', cloud.updatedAt);
        }catch(e){}
        setSyncStatus('ok');
        return true;
      } else {
        if(!cloud || !cloud.updatedAt) scheduleSync();
        setSyncStatus('ok');
        return false;
      }
    }catch(e){
      console.error(e);
      setSyncStatus('offline');
      return false;
    }
  }

  async function syncPush(){
    if(!SYNC_URL) return;
    if(syncInFlight){ scheduleSync(); return; }
    syncInFlight = true;
    setSyncStatus('syncing');
    try{
      const payload = {
        movements, categories, quickButtons,
        updatedAt: localStorage.getItem('moneda_updated_at') || new Date().toISOString()
      };
      const res = await fetch(SYNC_URL, { method:'POST', body: JSON.stringify(payload), cache:'no-store' });
      if(!res.ok) throw new Error('bad status');
      setSyncStatus('ok');
    }catch(e){
      console.error(e);
      setSyncStatus('offline');
    }finally{
      syncInFlight = false;
    }
  }

  function scheduleSync(){
    if(syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(syncPush, 900);
  }

  function markLocalChange(){
    try{ localStorage.setItem('moneda_updated_at', new Date().toISOString()); }catch(e){}
    scheduleSync();
  }

  async function applyCategoryUpgrades(){
    let changed = false;
    let deletedSuggested = [];
    try{ deletedSuggested = JSON.parse(localStorage.getItem('moneda_deleted_suggested_cats') || '[]'); }catch(e){ deletedSuggested = []; }
    const existingKeys = new Set(categories.map(c => c.key));
    SUGGESTED_NEW_CATS.forEach(nc => {
      if(!existingKeys.has(nc.key) && !deletedSuggested.includes(nc.key)){
        categories.splice(categories.length - 1, 0, { ...nc });
        changed = true;
      }
    });
    const servicios = categories.find(c => c.key === 'servicios');
    if(servicios && servicios.words){
      const before = servicios.words.length;
      servicios.words = servicios.words.filter(w => w !== 'alquiler' && w !== 'expensas' && w !== 'netflix' && w !== 'spotify' && w !== 'suscripcion');
      if(servicios.words.length !== before) changed = true;
    }
    // Fusiona palabras clave nuevas en categorías ya existentes, sin duplicar ni pisar lo que el usuario ya tenga
    const mergeWords = (key, newWords) => {
      const cat = categories.find(c => c.key === key);
      if(!cat) return;
      if(!cat.words) cat.words = [];
      newWords.forEach(w => { if(!cat.words.includes(w)){ cat.words.push(w); changed = true; } });
    };
    if(!localStorage.getItem('moneda_upgrade_v2')){
      mergeWords('servicios', ['personal','claro']);
      mergeWords('salud', ['psicologa','psicóloga','osteopata','osteópata']);
      mergeWords('vehiculo', ['seguro moto','seguro kangoo']);
      mergeWords('deudas', ['naranja x']);
      const planPeugeot = categories.find(c => (c.label||'').toLowerCase() === 'plan peugeot');
      if(planPeugeot){
        if(!planPeugeot.words) planPeugeot.words = [];
        if(!planPeugeot.words.includes('rombo')){ planPeugeot.words.push('rombo'); changed = true; }
      }
      const comida = categories.find(c => c.key === 'comida');
      if(comida && comida.budget === 50000){ comida.budget = 1000000; changed = true; }
      localStorage.setItem('moneda_upgrade_v2', '1');
    }
    if(changed) await saveCategories();
  }
  async function saveMovements(){ try{ localStorage.setItem('moneda_movements', JSON.stringify(movements)); markLocalChange(); } catch(e){ console.error(e); alert('No se pudo guardar. Puede que el navegador esté sin espacio o en modo incógnito.'); } }
  async function saveCategories(){ try{ localStorage.setItem('moneda_categories', JSON.stringify(categories)); markLocalChange(); } catch(e){ console.error(e); } }
  async function saveQuickButtons(){ try{ localStorage.setItem('moneda_quickbuttons', JSON.stringify(quickButtons)); markLocalChange(); } catch(e){ console.error(e); } }

  function updateRawHistory(){
    const uniq = [...new Set(movements.map(mv => mv.raw))].slice(-60);
    rawHistoryEl.innerHTML = uniq.map(r => `<option value="${escapeHtml(r)}">`).join('');
  }

  function renderKwAutocomplete(){
    const wrap = document.getElementById('kwAutocomplete');
    if(!wrap) return;
    const value = input.value;
    const tokens = value.split(/\s+/);
    const lastToken = tokens[tokens.length - 1] || '';
    const normToken = normalize(lastToken);
    // no sugerimos mientras está vacío o es puramente numérico (probablemente el monto)
    if(!normToken || /^[\d.,]+$/.test(normToken)){ wrap.innerHTML = ''; return; }
    const seen = new Set();
    const matches = [];
    categories.forEach(cat => {
      (cat.words||[]).forEach(w => {
        const normW = normalize(w);
        if(normW.startsWith(normToken) && normW !== normToken && !seen.has(normW)){
          seen.add(normW);
          matches.push({ word:w, icon:cat.icon });
        }
      });
    });
    if(matches.length === 0){ wrap.innerHTML = ''; return; }
    wrap.innerHTML = matches.slice(0,6).map(m =>
      `<span class="kw-autocomplete-chip" data-word="${escapeHtml(m.word)}">${m.icon} ${escapeHtml(m.word)}</span>`
    ).join('');
    wrap.querySelectorAll('.kw-autocomplete-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        tokens[tokens.length - 1] = chip.dataset.word;
        input.value = tokens.join(' ') + ' ';
        wrap.innerHTML = '';
        input.focus();
      });
    });
  }

  function monthMovements(d){
    d = d || viewDate;
    const mk = monthKeyOf(d);
    return movements.filter(mv => mv.date.startsWith(mk));
  }
  function populateFilterOptions(){
    filterCat.innerHTML = '<option value="">Todas</option>' + categories.map(c => `<option value="${c.key}">${c.icon} ${c.label}</option>`).join('');
  }

  // ---- Banners: daily reminder + weekly summary ----
  function renderBanners(){
    bannersEl.innerHTML = '';
    const now = new Date();
    const hasToday = movements.some(mv => mv.date.startsWith(todayKey()));
    if(!hasToday && now.getHours() >= 18){
      const b = document.createElement('div');
      b.className = 'banner warn-b';
      b.innerHTML = `<span>⏰ Todavía no anotaste nada hoy. ¿Te olvidaste de algún gasto?</span><button class="banner-close">✕</button>`;
      b.querySelector('.banner-close').addEventListener('click', () => b.remove());
      bannersEl.appendChild(b);
    }
    if(now.getDay() === 1){
      const oneWeekAgo = new Date(now); oneWeekAgo.setDate(now.getDate()-7);
      const twoWeeksAgo = new Date(now); twoWeeksAgo.setDate(now.getDate()-14);
      const lastWeek = movements.filter(mv => !mv.isIncome && new Date(mv.date) >= oneWeekAgo && new Date(mv.date) <= now).reduce((s,mv)=>s+mv.amount,0);
      const prevWeek = movements.filter(mv => !mv.isIncome && new Date(mv.date) >= twoWeeksAgo && new Date(mv.date) < oneWeekAgo).reduce((s,mv)=>s+mv.amount,0);
      if(lastWeek > 0 || prevWeek > 0){
        let msg;
        if(prevWeek > 0){
          const diff = ((lastWeek - prevWeek) / prevWeek) * 100;
          const dir = diff >= 0 ? 'más' : 'menos';
          msg = `📊 La semana pasada gastaste ${fmt(lastWeek)}, un ${Math.abs(Math.round(diff))}% ${dir} que la anterior.`;
        } else {
          msg = `📊 La semana pasada gastaste ${fmt(lastWeek)}.`;
        }
        const b = document.createElement('div');
        b.className = 'banner';
        b.innerHTML = `<span>${msg}</span><button class="banner-close">✕</button>`;
        b.querySelector('.banner-close').addEventListener('click', () => b.remove());
        bannersEl.appendChild(b);
      }
    }
    if(now.getDate() <= 5){
      const lastMonthDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
      const twoMonthsAgoDate = new Date(now.getFullYear(), now.getMonth()-2, 1);
      const lastMonthTotal = monthMovements(lastMonthDate).filter(mv => !mv.isIncome).reduce((s,mv)=>s+mv.amount,0);
      const prevMonthTotal = monthMovements(twoMonthsAgoDate).filter(mv => !mv.isIncome).reduce((s,mv)=>s+mv.amount,0);
      if(lastMonthTotal > 0){
        let msg;
        const monthLbl = monthLabel(lastMonthDate);
        if(prevMonthTotal > 0){
          const diff = ((lastMonthTotal - prevMonthTotal) / prevMonthTotal) * 100;
          const dir = diff >= 0 ? 'más' : 'menos';
          msg = `🗓️ En ${monthLbl} gastaste ${fmt(lastMonthTotal)}, un ${Math.abs(Math.round(diff))}% ${dir} que el mes anterior.`;
        } else {
          msg = `🗓️ En ${monthLbl} gastaste ${fmt(lastMonthTotal)}.`;
        }
        const b = document.createElement('div');
        b.className = 'banner';
        b.innerHTML = `<span>${msg}</span><button class="banner-close">✕</button>`;
        b.querySelector('.banner-close').addEventListener('click', () => b.remove());
        bannersEl.appendChild(b);
      }
    }
    if(movements.length > 0){
      let lastBackup = null;
      try{ lastBackup = localStorage.getItem('moneda_last_backup'); }catch(e){}
      const daysSince = lastBackup ? Math.floor((now - new Date(lastBackup + 'T00:00:00')) / 86400000) : null;
      if(daysSince === null || daysSince >= 14){
        const b = document.createElement('div');
        b.className = 'banner warn-b';
        b.innerHTML = `<span>💾 Hace rato no hacés un backup. Convendría exportar una copia por las dudas.</span><button class="banner-close">✕</button>`;
        b.querySelector('.banner-close').addEventListener('click', () => b.remove());
        bannersEl.appendChild(b);
      }
    }
  }

  // ---- Recurring suggestions ----
  function computeRecurringSuggestions(){
    const mk = monthKeyOf(viewDate);
    const alreadyThisMonth = new Set(monthMovements().map(mv => mv.category + '|' + Math.round(mv.amount/500)));
    const groups = {};
    movements.forEach(mv => {
      if(mv.date.startsWith(mk)) return;
      const bucket = Math.round(mv.amount/500);
      const key = mv.category + '|' + bucket;
      if(!groups[key]) groups[key] = { months:new Set(), sample:mv, sumAmount:0, count:0 };
      groups[key].months.add(mv.date.slice(0,7));
      groups[key].sumAmount += mv.amount;
      groups[key].count++;
    });
    const suggestions = [];
    Object.keys(groups).forEach(key => {
      const g = groups[key];
      if(g.months.size >= 2 && !alreadyThisMonth.has(key)){
        suggestions.push({ raw:g.sample.raw, category:g.sample.category, amount: Math.round(g.sumAmount/g.count), isIncome:g.sample.isIncome });
      }
    });
    return suggestions.slice(0,4);
  }
  function renderSuggestions(){
    const sugg = computeRecurringSuggestions();
    if(sugg.length === 0 || monthKeyOf(viewDate) !== monthKeyOf(new Date())){ suggestionsWrap.innerHTML = ''; return; }
    const wrap = document.createElement('div');
    wrap.className = 'suggestions';
    sugg.forEach(s => {
      const cat = findCategory(s.category);
      const chip = document.createElement('div');
      chip.className = 'sugg-chip';
      chip.textContent = `+ ${cat.icon} ${s.raw} · ${fmt(s.amount)}`;
      chip.addEventListener('click', async () => {
        const entry = { id: Date.now(), amount:s.amount, category:s.category, raw:s.raw, isIncome:s.isIncome, date:new Date().toISOString() };
        movements.push(entry);
        if(expandedDays) expandedDays.add(entry.date.slice(0,10));
        await saveMovements();
        render();
      });
      wrap.appendChild(chip);
    });
    suggestionsWrap.innerHTML = '';
    suggestionsWrap.appendChild(wrap);
  }

  // ---- Quick buttons (personalizados) ----

  function renderPieChart(totals, totalExpense){
    if(totalExpense <= 0){ pieChartEl.innerHTML = '<div class="empty-chart">Sin gastos este mes.</div>'; return; }
    let acc = 0;
    const stops = [];
    const legendItems = [];
    categories.forEach(cat => {
      const val = totals[cat.key] || 0;
      if(val <= 0) return;
      const pct = (val/totalExpense)*100;
      const color = catColor(cat.key);
      stops.push(`${color} ${acc}% ${acc+pct}%`);
      legendItems.push({ label:cat.label, icon:cat.icon, pct: Math.round(pct), color });
      acc += pct;
    });
    const gradient = `conic-gradient(${stops.join(', ')})`;
    const legendHtml = legendItems.sort((a,b)=>b.pct-a.pct).slice(0,6).map(li =>
      `<div class="legend-item"><span class="legend-dot" style="background:${li.color}"></span>${li.icon} ${li.label} · ${li.pct}%</div>`
    ).join('');
    pieChartEl.innerHTML = `<div class="pie-wrap"><div class="pie" style="background:${gradient}"></div><div class="legend">${legendHtml}</div></div>`;
  }

  function renderTrendChart(totals, prevTotals){
    const maxVal = Math.max(1, ...categories.map(c => Math.max(totals[c.key]||0, prevTotals[c.key]||0)));
    const rows = categories.filter(c => (totals[c.key]||0) > 0 || (prevTotals[c.key]||0) > 0).map(cat => {
      const now = totals[cat.key] || 0;
      const prev = prevTotals[cat.key] || 0;
      const nowPct = (now/maxVal)*100;
      const prevPct = (prev/maxVal)*100;
      let pctText = '—', pctClass = '';
      if(prev > 0){
        const diff = ((now-prev)/prev)*100;
        pctClass = diff >= 0 ? 'up' : 'down';
        pctText = (diff >= 0 ? '↑' : '↓') + Math.abs(Math.round(diff)) + '%';
      } else if(now > 0){
        pctText = 'nuevo'; pctClass = 'up';
      }
      return `<div class="trend-row">
        <div class="tr-label">${cat.icon} ${cat.label}</div>
        <div class="trend-bars">
          <div class="trend-bar-bg"><div class="trend-bar-fill now" style="width:${nowPct}%"></div></div>
          <div class="trend-bar-bg"><div class="trend-bar-fill prev" style="width:${prevPct}%"></div></div>
        </div>
        <div class="trend-pct ${pctClass}">${pctText}</div>
      </div>`;
    });
    trendChartEl.innerHTML = rows.length ? rows.join('') : '<div class="empty-chart">Sin datos suficientes.</div>';
  }

  function render(){
    monthLabelEl.textContent = monthLabel(viewDate);
    const now = new Date();
    document.getElementById('nextMonth').disabled = monthKeyOf(viewDate) >= monthKeyOf(now);

    const monthMoves = monthMovements();
    const totals = {};
    categories.forEach(c => totals[c.key] = 0);
    let totalExpense = 0, totalIncome = 0;
    monthMoves.forEach(mv => {
      if(mv.isIncome){ totalIncome += mv.amount; }
      else { totals[mv.category] = (totals[mv.category]||0) + mv.amount; totalExpense += mv.amount; }
    });
    totalExpenseEl.textContent = fmt(totalExpense);
    totalIncomeEl.textContent = fmt(totalIncome);
    totalBalanceEl.textContent = fmt(totalIncome - totalExpense);

    const prevDate = new Date(viewDate.getFullYear(), viewDate.getMonth()-1, 1);
    const prevTotals = {};
    categories.forEach(c => prevTotals[c.key] = 0);
    monthMovements(prevDate).forEach(mv => { if(!mv.isIncome) prevTotals[mv.category] = (prevTotals[mv.category]||0) + mv.amount; });

    renderPieChart(totals, totalExpense);
    renderTrendChart(totals, prevTotals);
    renderSuggestions();

    const isCurrentMonth = monthKeyOf(viewDate) === monthKeyOf(now);
    const daysInMonth = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 0).getDate();
    const daysRemaining = isCurrentMonth ? Math.max(1, daysInMonth - now.getDate() + 1) : null;

    catSummary.innerHTML = categories.map(cat => {
      const spent = totals[cat.key] || 0;
      const budget = cat.budget || 0;
      const pct = budget > 0 ? Math.round((spent/budget)*100) : null;
      const over = budget > 0 && spent > budget;
      const pctText = pct === null ? fmt(spent) : `${pct}%`;
      return `<span class="cat-summary-chip ${over ? 'over' : ''}"><span class="dot" style="background:${catColor(cat.key)}"></span>${cat.icon} ${pctText}</span>`;
    }).join('');

    catsEl.innerHTML = '';
    categories.forEach(cat => {
      const spent = totals[cat.key] || 0;
      const budget = cat.budget || 0;
      const pct = budget > 0 ? Math.min(100, (spent/budget)*100) : 0;
      let barClass = '';
      if(pct >= 100) barClass = 'danger'; else if(pct >= 80) barClass = 'warn';
      let dailyLine = '';
      if(isCurrentMonth && budget > 0){
        const remaining = budget - spent;
        const perDay = remaining / daysRemaining;
        dailyLine = perDay >= 0
          ? `<div class="daily-limit">Podés gastar ${fmt(perDay)}/día el resto del mes</div>`
          : `<div class="daily-limit" style="color:var(--danger)">Te pasaste por ${fmt(Math.abs(remaining))}</div>`;
      }
      const card = document.createElement('div');
      card.className = 'cat-card';
      const wordChips = (cat.words||[]).map(w => `<span class="kw-chip" data-cat="${cat.key}" data-word="${escapeHtml(w)}">${escapeHtml(w)} <span class="kw-x">✕</span></span>`).join('');
      card.innerHTML = `
        <div class="cat-top">
          <div class="cat-name"><span class="icon">${cat.icon}</span><span class="label-text">${cat.label}</span>${cat.key !== 'otros' ? `<button class="cat-del" data-cat="${cat.key}" title="Eliminar categoría">✕</button>` : ''}</div>
          <div class="cat-nums"><span class="spent">${fmt(spent)}</span>&nbsp;/&nbsp;$<input type="text" class="budget-edit" data-cat="${cat.key}" value="${budget}"></div>
        </div>
        <div class="bar-bg"><div class="bar-fill ${barClass}" style="width:${pct}%"></div></div>
        ${dailyLine}
        <div class="kw-toggle" data-cat="${cat.key}">🔑 palabras clave (${(cat.words||[]).length})</div>
        <div class="kw-panel" id="kw-panel-${cat.key}" style="display:${openKwPanel === cat.key ? 'block' : 'none'};">
          <div class="kw-chips">${wordChips || '<span class="kw-empty">Sin palabras clave todavía</span>'}</div>
          <div class="kw-add-row">
            <input type="text" class="kw-input" data-cat="${cat.key}" placeholder="ej: facebook, instagram">
            <button class="kw-add-btn" data-cat="${cat.key}">+ agregar</button>
          </div>
        </div>
      `;
      catsEl.appendChild(card);
    });

    catsEl.querySelectorAll('.kw-toggle').forEach(el => {
      el.addEventListener('click', () => {
        const panel = document.getElementById('kw-panel-' + el.dataset.cat);
        const isOpen = panel.style.display !== 'none';
        openKwPanel = isOpen ? null : el.dataset.cat;
        panel.style.display = isOpen ? 'none' : 'block';
      });
    });
    catsEl.querySelectorAll('.kw-x').forEach(el => {
      el.addEventListener('click', async (e) => {
        const chip = e.target.closest('.kw-chip');
        const catKey = chip.dataset.cat, word = chip.dataset.word;
        const cat = findCategory(catKey);
        cat.words = (cat.words||[]).filter(w => w !== word);
        await saveCategories(); render();
      });
    });
    async function addKeyword(catKey, input){
      const word = normalize(input.value.trim());
      if(!word) return;
      const cat = findCategory(catKey);
      cat.words = cat.words || [];
      if(!cat.words.includes(word)) cat.words.push(word);
      openKwPanel = catKey;
      await saveCategories(); render();
      const newInput = catsEl.querySelector(`.kw-input[data-cat="${catKey}"]`);
      if(newInput) newInput.focus();
    }
    catsEl.querySelectorAll('.kw-add-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = catsEl.querySelector(`.kw-input[data-cat="${btn.dataset.cat}"]`);
        addKeyword(btn.dataset.cat, input);
      });
    });
    catsEl.querySelectorAll('.kw-input').forEach(inp => {
      inp.addEventListener('keydown', (e) => { if(e.key === 'Enter') addKeyword(inp.dataset.cat, inp); });
    });

    catsEl.querySelectorAll('.budget-edit').forEach(inp => {
      inp.addEventListener('change', async (e) => {
        const catKey = e.target.dataset.cat;
        const val = parseFloat(e.target.value.replace(/[^\d.]/g,''));
        if(!isNaN(val) && val >= 0){ findCategory(catKey).budget = val; await saveCategories(); render(); }
      });
    });
    catsEl.querySelectorAll('.cat-del').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const catKey = e.target.dataset.cat;
        const cat = findCategory(catKey);
        openConfirmModal(
          `¿Eliminar "${cat.label}"?`,
          'Los movimientos ya anotados en esta categoría van a pasar a "Otros". Esta acción no se puede deshacer.',
          async () => {
            categories = categories.filter(c => c.key !== catKey);
            movements.forEach(mv => { if(mv.category === catKey) mv.category = 'otros'; });
            if(SUGGESTED_NEW_CATS.some(nc => nc.key === catKey)){
              let deletedSuggested = [];
              try{ deletedSuggested = JSON.parse(localStorage.getItem('moneda_deleted_suggested_cats') || '[]'); }catch(e){ deletedSuggested = []; }
              if(!deletedSuggested.includes(catKey)) deletedSuggested.push(catKey);
              localStorage.setItem('moneda_deleted_suggested_cats', JSON.stringify(deletedSuggested));
            }
            await saveCategories(); await saveMovements();
            populateFilterOptions(); render();
          }
        );
      });
    });

    renderMovements();
  }

  function renderMovements(){
    const search = searchInput.value.trim().toLowerCase();
    const catFilter = filterCat.value;
    const typeFilter = filterType.value;
    let list = monthMovements();
    if(search) list = list.filter(mv => mv.raw.toLowerCase().includes(search));
    if(catFilter) list = list.filter(mv => mv.category === catFilter);
    if(typeFilter === 'expense') list = list.filter(mv => !mv.isIncome);
    if(typeFilter === 'income') list = list.filter(mv => mv.isIncome);

    const hasActiveFilter = !!(search || catFilter || typeFilter);
    if(hasActiveFilter && list.length > 0){
      const expenseSum = list.filter(mv => !mv.isIncome).reduce((s,mv)=>s+mv.amount,0);
      const incomeSum = list.filter(mv => mv.isIncome).reduce((s,mv)=>s+mv.amount,0);
      let parts = [];
      if(expenseSum > 0) parts.push(`Gastos: <b>${fmt(expenseSum)}</b>`);
      if(incomeSum > 0) parts.push(`Ingresos: <b>${fmt(incomeSum)}</b>`);
      filterTotalEl.innerHTML = `${list.length} movimiento${list.length===1?'':'s'} · ${parts.join(' · ')}`;
      filterTotalEl.style.display = 'block';
    } else {
      filterTotalEl.style.display = 'none';
    }

    movesEl.innerHTML = '';
    if(list.length === 0){ movesEl.innerHTML = '<div class="empty">Nada por acá todavía.</div>'; return; }
    const sorted = [...list].sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);
    const catOptions = categories.map(c => `<option value="${c.key}">${c.icon} ${c.label}</option>`).join('');

    const dayTotals = {};
    const dayCounts = {};
    sorted.forEach(mv => {
      const dk = mv.date.slice(0,10);
      if(!mv.isIncome) dayTotals[dk] = (dayTotals[dk]||0) + mv.amount;
      dayCounts[dk] = (dayCounts[dk]||0) + 1;
    });

    // por defecto todos los días quedan colapsados, prolijo
    if(expandedDays === null){
      expandedDays = new Set();
    }

    function appendDaySummary(dayKey){
      const dh = new Date(dayKey + 'T12:00:00');
      const label = dh.toLocaleDateString('es-AR', { weekday:'long', day:'2-digit', month:'long' });
      const total = dayTotals[dayKey] || 0;
      const count = dayCounts[dayKey] || 0;
      const isExpanded = expandedDays.has(dayKey);
      const bar = document.createElement('div');
      bar.className = 'day-summary' + (isExpanded ? ' expanded' : '');
      bar.innerHTML = `
        <span class="day-summary-arrow">▸</span>
        <span class="day-summary-label">${label.charAt(0).toUpperCase() + label.slice(1)}</span>
        <span class="day-summary-count">(${count})</span>
        <span class="day-summary-total">${fmt(total)}</span>
      `;
      bar.addEventListener('click', () => {
        if(expandedDays.has(dayKey)) expandedDays.delete(dayKey);
        else expandedDays.add(dayKey);
        renderMovements();
      });
      movesEl.appendChild(bar);
      const body = document.createElement('div');
      body.className = 'day-body' + (isExpanded ? '' : ' collapsed');
      movesEl.appendChild(body);
      return body;
    }

    async function commitField(mvId, field, rawValue){
      const mvObj = movements.find(m => m.id === mvId);
      if(!mvObj) return false;
      if(field === 'amount'){
        const num = parseFloat(String(rawValue).replace(/[^\d.]/g,''));
        if(isNaN(num) || num <= 0) return false;
        mvObj.amount = num;
      } else if(field === 'date'){
        if(!rawValue) return false;
        const oldTime = new Date(mvObj.date);
        const [yy,mm,dd] = rawValue.split('-').map(Number);
        oldTime.setFullYear(yy, mm-1, dd);
        mvObj.date = oldTime.toISOString();
      } else if(field === 'note'){
        mvObj.note = String(rawValue).trim();
      } else if(field === 'raw'){
        if(!String(rawValue).trim()) return false;
        mvObj.raw = String(rawValue).trim();
        const reparsed = parseAmount(mvObj.raw);
        if(reparsed !== null && reparsed > 0) mvObj.amount = reparsed;
      }
      await saveMovements();
      if(field === 'raw') updateRawHistory();
      return true;
    }

    function makeInlineEditable(el, mv, field, inputType, placeholder){
      el.addEventListener('click', (e) => {
        if(el.querySelector('input')) return;
        const current = field === 'amount' ? mv.amount
          : field === 'date' ? mv.date.slice(0,10)
          : field === 'note' ? (mv.note || '')
          : mv.raw;
        const inp = document.createElement('input');
        inp.type = inputType;
        inp.className = 'inline-edit-input';
        inp.value = current;
        if(placeholder) inp.placeholder = placeholder;
        el.innerHTML = '';
        el.appendChild(inp);
        inp.focus();
        if(inp.select) inp.select();
        let done = false;
        const finish = async (save) => {
          if(done) return;
          done = true;
          if(save){
            const ok = await commitField(mv.id, field, inp.value);
            if(!ok){ render(); return; }
          }
          render();
        };
        inp.addEventListener('blur', () => finish(true));
        inp.addEventListener('keydown', (ev) => {
          if(ev.key === 'Enter'){ ev.preventDefault(); finish(true); }
          if(ev.key === 'Escape'){ ev.preventDefault(); finish(false); }
        });
      });
    }

    let lastDayKey = null;
    let currentDayBody = null;
    sorted.forEach(mv => {
      const dayKey = mv.date.slice(0,10);
      if(dayKey !== lastDayKey){
        currentDayBody = appendDaySummary(dayKey);
        lastDayKey = dayKey;
      }

      const d = new Date(mv.date);
      const dateStr = d.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit' });
      const row = document.createElement('div');
      row.className = 'move';
      row.innerHTML = `
        <div class="move-left">
          <div class="move-cat">${mv.isIncome ? '💰 Ingreso' : `<select class="cat-select" data-id="${mv.id}">${catOptions}</select>`}</div>
          <div class="move-raw" title="Tocá para editar">${escapeHtml(mv.raw)}</div>
          <div class="move-note" title="Tocá para editar">${mv.note ? '📝 ' + escapeHtml(mv.note) : '+ agregar nota'}</div>
          <div class="move-date" title="Tocá para editar">${dateStr}</div>
        </div>
        <div style="display:flex;align-items:center;">
          <div class="move-amount ${mv.isIncome ? 'income' : ''}" title="Tocá para editar">${mv.isIncome ? '+' : ''}${fmt(mv.amount)}</div>
          <button class="move-del" data-id="${mv.id}" title="Borrar">✕</button>
        </div>
      `;
      currentDayBody.appendChild(row);
      if(!mv.isIncome){
        const sel = row.querySelector('.cat-select');
        sel.value = mv.category;
        sel.addEventListener('change', async (e) => {
          const mvObj = movements.find(m => m.id === mv.id);
          if(mvObj){ mvObj.category = e.target.value; await saveMovements(); render(); }
        });
      }
      makeInlineEditable(row.querySelector('.move-raw'), mv, 'raw', 'text', 'Detalle');
      makeInlineEditable(row.querySelector('.move-note'), mv, 'note', 'text', 'Nota opcional');
      makeInlineEditable(row.querySelector('.move-date'), mv, 'date', 'date');
      makeInlineEditable(row.querySelector('.move-amount'), mv, 'amount', 'text', 'Monto');
    });
    movesEl.querySelectorAll('.move-del').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = Number(e.target.dataset.id);
        const mv = movements.find(m => m.id === id);
        if(!mv) return;
        openConfirmModal(
          '¿Eliminar este movimiento?',
          `${mv.isIncome ? 'Ingreso' : 'Gasto'}: "${escapeHtml(mv.raw)}" · ${fmt(mv.amount)}. Esta acción no se puede deshacer.`,
          async () => {
            movements = movements.filter(m => m.id !== id);
            await saveMovements(); render();
          }
        );
      });
    });
  }

  function escapeHtml(str){ const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

  async function handleSend(){
    const text = input.value.trim();
    if(!text) return;
    const parsed = parseMessage(text);
    if(!parsed){
      preview.className = 'parse-preview show';
      preview.innerHTML = 'No encontré un monto ahí. Probá algo como <b>"800 café"</b>.';
      return;
    }
    const chosenCat = parsed.category;
    const dateStr = composerDate.value || todayKey();
    const note = composerNote.value.trim();
    const d = new Date();
    const [yy,mm,dd] = dateStr.split('-').map(Number);
    d.setFullYear(yy, mm-1, dd);
    const entry = { id: Date.now(), amount:parsed.amount, category: parsed.isIncome ? parsed.category : chosenCat, raw:parsed.raw, note, isIncome:parsed.isIncome, date:d.toISOString() };
    movements.push(entry);
    if(expandedDays) expandedDays.add(entry.date.slice(0,10));
    await saveMovements();
    if(parsed.isIncome){
      preview.className = 'parse-preview show income';
      preview.innerHTML = `Anotado: <b>+${fmt(parsed.amount)}</b> como ingreso 💰`;
    } else {
      const cat = findCategory(entry.category);
      preview.className = 'parse-preview show';
      preview.innerHTML = `Anotado: <b>${fmt(parsed.amount)}</b> en <b>${cat.icon} ${cat.label}</b> (${d.toLocaleDateString('es-AR')})`;
    }
    input.value = '';
    document.getElementById('kwAutocomplete').innerHTML = '';
    composerNote.value = '';
    composerDate.value = todayKey();
    viewDate = new Date();
    renderBanners();
    render();
    updateRawHistory();
    setTimeout(() => { preview.className = 'parse-preview'; }, 2800);
  }

  function exportCSV(){
    const list = monthMovements().sort((a,b) => a.date.localeCompare(b.date));
    if(list.length === 0){ alert('No hay movimientos este mes para exportar.'); return; }
    let csv = 'Fecha,Tipo,Categoria,Monto,Detalle,Nota\n';
    list.forEach(mv => {
      const cat = findCategory(mv.category);
      const d = new Date(mv.date).toLocaleDateString('es-AR');
      const tipo = mv.isIncome ? 'Ingreso' : 'Gasto';
      const catLabel = mv.isIncome ? '' : cat.label;
      csv += `${d},${tipo},${catLabel},${mv.amount},"${mv.raw.replace(/"/g,'""')}","${(mv.note||'').replace(/"/g,'""')}"\n`;
    });
    const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `moneda-${monthKeyOf(viewDate)}.csv`; a.click();
    URL.revokeObjectURL(url);
  }

  function exportBackup(){
    const data = { movements, categories, quickButtons, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `moneda-backup-${todayKey()}.json`; a.click();
    URL.revokeObjectURL(url);
    try{ localStorage.setItem('moneda_last_backup', todayKey()); }catch(e){}
    renderBanners();
  }

  async function importBackup(file){
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      if(!Array.isArray(data.movements) || !Array.isArray(data.categories)) throw new Error('formato inválido');
      if(!confirm('Esto reemplaza todos tus datos actuales por los del backup. ¿Continuar?')) return;
      movements = data.movements;
      categories = data.categories;
      quickButtons = Array.isArray(data.quickButtons) ? data.quickButtons : [];
      await saveMovements(); await saveCategories(); await saveQuickButtons();
      populateFilterOptions(); renderBanners(); render(); renderQuickButtons(); updateRawHistory();
      alert('Backup restaurado con éxito.');
    }catch(e){
      alert('No se pudo leer el archivo. Asegurate de que sea un backup exportado desde moneda.');
    }
  }

  sendBtn.addEventListener('click', handleSend);
  input.addEventListener('keydown', (e) => { if(e.key === 'Enter') handleSend(); });
  input.addEventListener('input', renderKwAutocomplete);
  composerNote.addEventListener('keydown', (e) => { if(e.key === 'Enter') handleSend(); });
  composerDate.addEventListener('keydown', (e) => { if(e.key === 'Enter') handleSend(); });
  searchInput.addEventListener('input', renderMovements);
  filterCat.addEventListener('change', renderMovements);
  filterType.addEventListener('change', renderMovements);
  exportBtn.addEventListener('click', exportCSV);
  backupBtn.addEventListener('click', exportBackup);
  restoreFile.addEventListener('change', (e) => { if(e.target.files[0]) importBackup(e.target.files[0]); e.target.value=''; });

  document.getElementById('prevMonth').addEventListener('click', () => { viewDate.setMonth(viewDate.getMonth()-1); viewDate = new Date(viewDate); expandedDays = null; render(); });
  document.getElementById('nextMonth').addEventListener('click', () => {
    const now = new Date();
    if(monthKeyOf(viewDate) >= monthKeyOf(now)) return;
    viewDate.setMonth(viewDate.getMonth()+1); viewDate = new Date(viewDate); expandedDays = null; render();
  });
  document.getElementById('monthLabel').addEventListener('click', openMonthPicker);

  function openMonthPicker(){
    const mesesCortos = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    let pickerYear = viewDate.getFullYear();
    const nowD = new Date();

    function draw(){
      confirmModalWrap.innerHTML = `
        <div class="modal-overlay">
          <div class="modal-card month-picker-card">
            <div class="modal-title">Elegir mes</div>
            <div class="month-picker-year">
              <button id="pickerPrevYear">←</button>
              <div class="year-label">${pickerYear}</div>
              <button id="pickerNextYear" ${pickerYear >= nowD.getFullYear() ? 'disabled' : ''}>→</button>
            </div>
            <div class="month-picker-grid">
              ${mesesCortos.map((m, i) => {
                const disabled = pickerYear > nowD.getFullYear() || (pickerYear === nowD.getFullYear() && i > nowD.getMonth());
                const selected = pickerYear === viewDate.getFullYear() && i === viewDate.getMonth();
                return `<button data-month="${i}" ${disabled ? 'disabled' : ''} class="${selected ? 'selected' : ''}">${m}</button>`;
              }).join('')}
            </div>
          </div>
        </div>
      `;
      document.getElementById('pickerPrevYear').addEventListener('click', () => { pickerYear--; draw(); });
      document.getElementById('pickerNextYear').addEventListener('click', () => { if(pickerYear < nowD.getFullYear()) { pickerYear++; draw(); } });
      confirmModalWrap.querySelectorAll('.month-picker-grid button').forEach(btn => {
        btn.addEventListener('click', () => {
          if(btn.disabled) return;
          viewDate = new Date(pickerYear, parseInt(btn.dataset.month), 1);
          expandedDays = null;
          confirmModalWrap.innerHTML = '';
          render();
        });
      });
      confirmModalWrap.querySelector('.modal-overlay').addEventListener('click', (e) => { if(e.target.classList.contains('modal-overlay')) confirmModalWrap.innerHTML = ''; });
    }
    draw();
  }

  function setCatSectionOpen(open){
    catSectionBody.style.display = open ? 'block' : 'none';
    catSummary.style.display = open ? 'none' : 'flex';
    catSectionCaret.classList.toggle('open', open);
    try{ localStorage.setItem('moneda_catsection_open', open ? '1' : '0'); }catch(e){}
  }
  catSectionToggle.querySelector('span:first-child').addEventListener('click', () => {
    setCatSectionOpen(catSectionBody.style.display === 'none');
  });
  catSummary.addEventListener('click', () => setCatSectionOpen(true));

  toggleNewCat.addEventListener('click', () => { newCatRow.style.display = newCatRow.style.display === 'none' ? 'flex' : 'none'; });
  addCatBtn.addEventListener('click', async () => {
    const icon = document.getElementById('newCatIcon').value.trim() || '🏷️';
    const name = document.getElementById('newCatName').value.trim();
    const budget = parseFloat(document.getElementById('newCatBudget').value.replace(/[^\d.]/g,'')) || 0;
    if(!name){ alert('Ponele un nombre a la categoría.'); return; }
    const key = 'c_' + name.toLowerCase().replace(/[^a-z0-9]+/g,'_') + '_' + Date.now();
    categories.splice(categories.length - 1, 0, { key, label:name, icon, words:[], budget, builtin:false });
    await saveCategories(); populateFilterOptions();
    document.getElementById('newCatIcon').value = ''; document.getElementById('newCatName').value = ''; document.getElementById('newCatBudget').value = '';
    newCatRow.style.display = 'none'; render();
  });

  toggleNewQuick.addEventListener('click', () => {
    const opening = newQuickRow.style.display === 'none';
    if(opening){ document.getElementById('newQuickCat').innerHTML = categories.map(c => `<option value="${c.key}">${c.icon} ${c.label}</option>`).join(''); }
    newQuickRow.style.display = opening ? 'flex' : 'none';
  });
  addQuickBtn.addEventListener('click', async () => {
    const icon = document.getElementById('newQuickIcon').value.trim() || '⚡';
    const name = document.getElementById('newQuickName').value.trim();
    const amount = parseFloat(document.getElementById('newQuickAmount').value.replace(/[^\d.]/g,''));
    const category = document.getElementById('newQuickCat').value;
    if(!name){ alert('Ponele un nombre al botón.'); return; }
    if(isNaN(amount) || amount <= 0){ alert('Poné un monto válido.'); return; }
    quickButtons.push({ icon, name, amount, category });
    await saveQuickButtons();
    document.getElementById('newQuickIcon').value=''; document.getElementById('newQuickName').value=''; document.getElementById('newQuickAmount').value='';
    newQuickRow.style.display = 'none';
    renderQuickButtons();
  });

  document.getElementById('saveQuickEditBtn').addEventListener('click', async () => {
    const idx = Number(document.getElementById('editQuickRow').dataset.idx);
    const icon = document.getElementById('editQuickIcon').value.trim() || '⚡';
    const name = document.getElementById('editQuickName').value.trim();
    const amount = parseFloat(document.getElementById('editQuickAmount').value.replace(/[^\d.]/g,''));
    const category = document.getElementById('editQuickCat').value;
    if(!name){ alert('Ponele un nombre al botón.'); return; }
    if(isNaN(amount) || amount <= 0){ alert('Poné un monto válido.'); return; }
    quickButtons[idx] = { icon, name, amount, category };
    await saveQuickButtons();
    document.getElementById('editQuickRow').style.display = 'none';
    renderQuickButtons();
  });
  document.getElementById('cancelQuickEditBtn').addEventListener('click', () => {
    document.getElementById('editQuickRow').style.display = 'none';
  });

  themeToggle.addEventListener('click', async () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(isDark){ document.documentElement.removeAttribute('data-theme'); themeToggle.textContent = '🌙'; }
    else { document.documentElement.setAttribute('data-theme','dark'); themeToggle.textContent = '☀️'; }
    try{ localStorage.setItem('moneda_theme', isDark ? 'light' : 'dark'); }catch(e){}
  });

  document.getElementById('syncStatus').style.cursor = 'pointer';
  document.getElementById('syncStatus').addEventListener('click', async () => {
    const changed = await pullFromCloud();
    populateFilterOptions();
    renderBanners();
    render();
    renderQuickButtons();
    updateRawHistory();
  });

  // ---- Voice input (Web Speech API) ----
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(SpeechRecognition){
    recognition = new SpeechRecognition();
    recognition.lang = 'es-AR';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      input.value = transcript;
    };
    recognition.onend = () => { recognizing = false; micBtn.classList.remove('listening'); };
    recognition.onerror = () => { recognizing = false; micBtn.classList.remove('listening'); };
    micBtn.addEventListener('click', () => {
      if(recognizing){ recognition.stop(); return; }
      recognizing = true; micBtn.classList.add('listening'); recognition.start();
    });
  } else {
    micBtn.style.display = 'none';
  }

  loadData();

  // Reintenta traer datos frescos de la nube cuando la app vuelve a primer plano
  // (por ejemplo al reabrir el ícono instalado, que a veces queda con una copia vieja en memoria)
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') pullFromCloud().then(changed => {
      if(changed){
        populateFilterOptions();
        renderBanners();
        render();
        renderQuickButtons();
        updateRawHistory();
      }
    });
  });
})();
</script>

</body>
</html>
