<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mi Ruta — Comisiones Mauri</title>
<meta name="theme-color" content="#0d1113">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230d1113'/%3E%3Cpath d='M20 70 L50 25 L80 70' stroke='%23f2a93b' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='50' cy='78' r='6' fill='%23f2a93b'/%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0d1113;
    --bg-elev: #171c1f;
    --bg-elev2: #1f2529;
    --line: #2a3237;
    --ink: #eef1f0;
    --ink-soft: #93a09c;
    --ink-faint: #5c6a67;
    --accent: #f2a93b;
    --accent-soft: #3a2e17;
    --accent-ink: #17130a;
    --ok: #4caf7d;
    --ok-soft: #163024;
    --danger: #e2604f;
    --danger-soft: #331c18;
    --info: #5aa9e6;
    --info-soft: #17242e;
    --purple: #b18cf0;
    --radius: 14px;
    --radius-sm: 10px;
    --shadow: 0 4px 18px rgba(0,0,0,.35);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    overscroll-behavior-y: none;
  }
  input, textarea, select, button{ font-family:inherit; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  button{ cursor:pointer; }
  ::-webkit-scrollbar{ width:0; height:0; }

  .app{ max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; background:var(--bg); }

  /* ---------- Barra superior ---------- */
  .topbar{
    position:sticky; top:0; z-index:30;
    background:rgba(13,17,19,.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
    padding:14px 16px; display:flex; align-items:center; gap:10px;
  }
  .topbar h1{ font-size:19px; margin:0; flex:1; letter-spacing:-.01em; }
  .topbar .back{
    width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:var(--bg-elev);
    color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:18px;
  }
  .topbar .icon-btn{
    width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:var(--bg-elev);
    color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .topbar .sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }

  .view{ display:none; flex:1; flex-direction:column; padding-bottom:110px; }
  .view.active{ display:flex; }

  /* ---------- Home: listado de rutas ---------- */
  .search-row{ padding:14px 16px 4px 16px; }
  .search-box{
    display:flex; align-items:center; gap:8px; background:var(--bg-elev);
    border:1px solid var(--line); border-radius:12px; padding:10px 12px;
  }
  .search-box input{ flex:1; background:transparent; border:none; outline:none; color:var(--ink); font-size:15px; }
  .search-box .ic{ color:var(--ink-soft); font-size:15px; }

  .group-label{ padding:16px 16px 6px 16px; color:var(--ink-soft); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }

  .route-row{
    margin:0 12px 8px 12px; padding:14px; border-radius:var(--radius); background:var(--bg-elev);
    border:1px solid var(--line); display:flex; align-items:center; gap:12px;
  }
  .route-row:active{ background:var(--bg-elev2); }
  .route-row .date-badge{
    width:46px; text-align:center; flex-shrink:0;
  }
  .route-row .date-badge .d{ font-size:20px; font-weight:700; line-height:1; font-family:'JetBrains Mono',monospace; }
  .route-row .date-badge .m{ font-size:10px; color:var(--ink-soft); text-transform:uppercase; }
  .route-row .info{ flex:1; min-width:0; }
  .route-row .info .name{ font-size:15px; font-weight:600; }
  .route-row .info .meta{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; display:flex; gap:8px; flex-wrap:wrap; }
  .route-row .chevron{ color:var(--ink-faint); font-size:18px; }
  .route-row .badge-estado{
    font-size:10px; padding:2px 7px; border-radius:20px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;
  }
  .badge-plan{ background:var(--info-soft); color:var(--info); }
  .badge-done{ background:var(--ok-soft); color:var(--ok); }

  .empty-state{ text-align:center; padding:60px 30px; color:var(--ink-soft); }
  .empty-state .em{ font-size:38px; margin-bottom:10px; }
  .empty-state .t{ font-size:15px; color:var(--ink); font-weight:600; margin-bottom:4px; }
  .empty-state .s{ font-size:13px; line-height:1.5; }

  .fab-bar{
    position:fixed; bottom:0; left:0; right:0; z-index:40;
    display:flex; justify-content:center;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px)) 16px;
    background:linear-gradient(to top, var(--bg) 60%, transparent);
    pointer-events:none;
  }
  .fab-bar .inner{ max-width:480px; width:100%; pointer-events:auto; }
  .btn-primary{
    width:100%; background:var(--accent); color:var(--accent-ink); border:none; border-radius:14px;
    padding:15px; font-size:15.5px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:8px;
    box-shadow:var(--shadow);
  }
  .btn-primary:active{ transform:scale(.98); }
  .btn-secondary{
    width:100%; background:var(--bg-elev); color:var(--ink); border:1px solid var(--line); border-radius:14px;
    padding:14px; font-size:14.5px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-danger-outline{
    width:100%; background:var(--danger-soft); color:var(--danger); border:1px solid var(--danger); border-radius:14px;
    padding:14px; font-size:14.5px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .row-2{ display:flex; gap:10px; }
  .row-2 > *{ flex:1; }

  .tabbar{
    position:sticky; bottom:0; z-index:30; background:rgba(13,17,19,.95); backdrop-filter:blur(8px);
    border-top:1px solid var(--line); display:flex; padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px)) 6px;
  }
  .tabbar button{
    flex:1; background:none; border:none; color:var(--ink-faint); display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 4px; font-size:10.5px; border-radius:10px;
  }
  .tabbar button.active{ color:var(--accent); }
  .tabbar button .ic{ font-size:19px; }

  /* ---------- Ruta detail ---------- */
  .ruta-summary{
    margin:12px 16px 4px 16px; padding:14px; border-radius:var(--radius); background:var(--bg-elev);
    border:1px solid var(--line); display:flex; justify-content:space-between; gap:6px;
  }
  .ruta-summary .stat{ text-align:center; flex:1; }
  .ruta-summary .stat .v{ font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:700; }
  .ruta-summary .stat .l{ font-size:10px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }
  .ruta-summary .divider{ width:1px; background:var(--line); }

  .ruta-toolbar{ display:flex; gap:8px; padding:10px 16px 4px 16px; }
  .chip-btn{
    flex:1; background:var(--bg-elev); border:1px solid var(--line); color:var(--ink); border-radius:11px;
    padding:9px 8px; font-size:12.5px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .chip-btn.on{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }

  .stop-list{ padding:10px 10px 20px 10px; position:relative; }
  .stop{
    position:relative; margin:0 0 10px 0; padding:12px 12px 12px 12px; border-radius:var(--radius);
    background:var(--bg-elev); border:1px solid var(--line); display:flex; gap:10px;
    touch-action:pan-y;
  }
  .stop.dragging{ opacity:.85; box-shadow:var(--shadow); z-index:50; background:var(--bg-elev2); }
  .stop.completada{ opacity:.55; }
  .stop.fallida{ border-color:var(--danger); }
  .stop .order-col{ display:flex; flex-direction:column; align-items:center; padding-top:2px; align-self:stretch; min-height:100%; }
  .stop .order-num{
    width:26px; height:26px; border-radius:50%; background:var(--bg-elev2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; font-family:'JetBrains Mono',monospace; color:var(--ink-soft);
    flex-shrink:0;
  }
  .stop.completada .order-num{ background:var(--ok-soft); color:var(--ok); border-color:var(--ok); }
  .stop.fallida .order-num{ background:var(--danger-soft); color:var(--danger); border-color:var(--danger); }
  .stop .route-line{ width:2px; flex:1; background:repeating-linear-gradient(to bottom, var(--line) 0 4px, transparent 4px 8px); margin-top:2px; }
  .stop .body{ flex:1; min-width:0; }
  .stop .title-row{ display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
  .stop .title{ font-size:14.5px; font-weight:700; line-height:1.3; }
  .stop .addr{ font-size:12px; color:var(--ink-soft); margin-top:2px; line-height:1.35; }
  .stop .tags{ display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .tag{ font-size:10.5px; padding:3px 7px; border-radius:7px; background:var(--bg-elev2); color:var(--ink-soft); border:1px solid var(--line); display:inline-flex; align-items:center; gap:3px; }
  .tag.entrega{ color:var(--info); border-color:var(--info); background:var(--info-soft); }
  .tag.recogida{ color:var(--purple); border-color:var(--purple); background:#241b33; }
  .tag.precio{ color:var(--accent); border-color:var(--accent); background:var(--accent-soft); font-weight:700; }
  .stop .drag-handle{
    background:none; border:none; color:var(--ink-faint); font-size:19px; padding:4px 2px 4px 8px; touch-action:none; flex-shrink:0; align-self:flex-start;
  }
  .stop .time-est{ font-size:11px; color:var(--ink-faint); margin-top:6px; font-family:'JetBrains Mono',monospace; }

  .search-hidden-note{ text-align:center; font-size:12px; color:var(--ink-soft); padding:10px; }

  /* ---------- Botones flotantes de acción ruta ---------- */
  .action-3{ display:flex; gap:8px; padding:4px 16px 12px 16px; }
  .action-3 button{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; padding:12px 4px; border-radius:14px;
    border:1px solid var(--line); background:var(--bg-elev); color:var(--ink); font-size:12px; font-weight:700;
  }
  .action-3 button .ic{ font-size:20px; }
  .action-3 button.navegar{ background:#1a2c40; border-color:var(--info); color:var(--info); }
  .action-3 button.fallida-btn{ background:var(--danger-soft); border-color:var(--danger); color:var(--danger); }
  .action-3 button.hecho{ background:var(--ok-soft); border-color:var(--ok); color:var(--ok); }
  .action-3 button.done-state{ background:var(--ok); color:#0d1113; }

  /* ---------- Formularios genéricos ---------- */
  .form-section{ padding:14px 16px 4px 16px; }
  .field-label{ font-size:12px; color:var(--ink-soft); margin:14px 0 6px 0; text-transform:uppercase; letter-spacing:.05em; }
  .field-label:first-child{ margin-top:0; }
  .input, textarea.input{
    width:100%; background:var(--bg-elev); border:1px solid var(--line); border-radius:12px; color:var(--ink);
    padding:12px 13px; font-size:15px; outline:none;
  }
  .input:focus, textarea.input:focus{ border-color:var(--accent); }
  textarea.input{ resize:vertical; min-height:70px; font-family:inherit; }
  .seg{ display:flex; gap:6px; background:var(--bg-elev); border:1px solid var(--line); border-radius:12px; padding:4px; }
  .seg button{
    flex:1; background:none; border:none; color:var(--ink-soft); padding:9px 4px; border-radius:9px; font-size:13px; font-weight:600;
  }
  .seg button.on{ background:var(--accent); color:var(--accent-ink); }
  .seg.multi button.on{ background:var(--info); color:#0d1113; }
  .row-inline{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 0; border-bottom:1px solid var(--line); }
  .row-inline:last-child{ border-bottom:none; }
  .row-inline .lbl{ font-size:14.5px; font-weight:500; display:flex; align-items:center; gap:8px; }
  .row-inline .lbl .ic{ font-size:16px; color:var(--ink-soft); width:18px; text-align:center; }
  .row-inline .val{ color:var(--ink-soft); font-size:13.5px; }
  .stepper{ display:flex; align-items:center; gap:10px; background:var(--bg-elev); border:1px solid var(--line); border-radius:10px; padding:4px; }
  .stepper button{ width:28px; height:28px; border-radius:8px; border:none; background:var(--bg-elev2); color:var(--ink); font-size:16px; font-weight:700; }
  .stepper .n{ min-width:22px; text-align:center; font-weight:700; font-family:'JetBrains Mono',monospace; }
  .card-block{ margin:0 16px 12px 16px; padding:4px 14px; border-radius:var(--radius); background:var(--bg-elev); border:1px solid var(--line); }

  .photo-strip{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .photo-thumb{ width:64px; height:64px; border-radius:10px; object-fit:cover; border:1px solid var(--line); }
  .photo-add{
    width:64px; height:64px; border-radius:10px; border:1px dashed var(--ink-faint); background:none; color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; font-size:20px;
  }

  .footer-actions{ padding:16px; display:flex; flex-direction:column; gap:10px; }

  /* ---------- Chips locales/clientes ---------- */
  .chips-wrap{ display:flex; flex-wrap:wrap; gap:8px; padding:10px 16px; }
  .chip-item{
    padding:9px 13px; border-radius:11px; background:var(--bg-elev); border:1px solid var(--line); font-size:13px;
    display:flex; flex-direction:column; align-items:flex-start; max-width:100%;
  }
  .chip-item .nm{ font-weight:600; }
  .chip-item .dir{ font-size:11px; color:var(--ink-soft); }
  .segtabs{ display:flex; gap:6px; padding:12px 16px 0 16px; }
  .segtabs button{ flex:1; padding:10px; border-radius:11px; border:1px solid var(--line); background:var(--bg-elev); color:var(--ink-soft); font-weight:700; font-size:13.5px; }
  .segtabs button.on{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }

  /* ---------- Modal/sheet ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:100; display:none; align-items:flex-end; justify-content:center;
  }
  .overlay.active{ display:flex; }
  .sheet{
    background:var(--bg-elev); width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px)) 16px;
    max-height:85vh; overflow-y:auto; border-top:1px solid var(--line);
    animation:slideUp .18s ease-out;
  }
  @keyframes slideUp{ from{ transform:translateY(20px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .sheet .handle{ width:36px; height:4px; border-radius:3px; background:var(--line); margin:0 auto 14px auto; }
  .sheet h3{ margin:0 0 12px 0; font-size:16px; }
  .sheet .close-x{ position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:9px; background:var(--bg-elev2); border:none; color:var(--ink); font-size:15px; }

  .overlay.center{ align-items:center; }
  .sheet.center-box{ border-radius:18px; max-width:340px; margin:0 20px; }

  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--bg-elev2); color:var(--ink);
    padding:11px 18px; border-radius:11px; font-size:13.5px; box-shadow:var(--shadow); z-index:200; border:1px solid var(--line);
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .toast.show{ opacity:1; }

  .kv-row{ display:flex; justify-content:space-between; padding:8px 0; font-size:14px; }
  .kv-row .k{ color:var(--ink-soft); }
  .kv-row.total{ border-top:1px solid var(--line); margin-top:4px; padding-top:12px; font-weight:700; font-size:15px; }

  .fuel-item{ display:flex; justify-content:space-between; align-items:center; background:var(--bg-elev2); border-radius:10px; padding:9px 12px; margin-bottom:6px; font-size:13.5px; }
  .fuel-item button{ background:none; border:none; color:var(--danger); font-size:16px; }

  a.link-plain{ color:var(--info); text-decoration:none; }

  .helper-txt{ font-size:11.5px; color:var(--ink-faint); margin-top:6px; line-height:1.4; }

  textarea#exportOut{ width:100%; min-height:220px; background:var(--bg-elev2); border:1px solid var(--line); border-radius:10px; color:var(--ink); padding:10px; font-size:12px; font-family:'JetBrains Mono',monospace; }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ===================== HOME: LISTADO DE RUTAS ===================== -->
  <div class="view active" id="view-home">
    <div class="topbar">
      <h1>Mi Ruta</h1>
      <button class="icon-btn" onclick="goView('view-historial')" title="Historial e informes">📊</button>
      <button class="icon-btn" onclick="goView('view-agenda')" title="Locales y clientes">📇</button>
    </div>
    <div class="search-row">
      <div class="search-box">
        <span class="ic">🔎</span>
        <input id="homeSearch" placeholder="Buscar ruta por fecha o nombre..." oninput="renderHome()">
      </div>
    </div>
    <div id="homeList"></div>
    <div class="fab-bar"><div class="inner">
      <button class="btn-primary" onclick="crearRuta()">＋ Crear ruta</button>
    </div></div>
  </div>

  <!-- ===================== RUTA: LISTA DE PARADAS ===================== -->
  <div class="view" id="view-ruta">
    <div class="topbar">
      <button class="back" onclick="goView('view-home')">←</button>
      <div style="flex:1">
        <h1 id="rutaTitulo" style="font-size:16px;">Ruta</h1>
        <div class="sub" id="rutaSubtitulo"></div>
      </div>
      <button class="icon-btn" onclick="abrirMenuRuta()">⋯</button>
    </div>

    <div class="ruta-summary">
      <div class="stat"><div class="v" id="sumParadas">0</div><div class="l">Paradas</div></div>
      <div class="divider"></div>
      <div class="stat"><div class="v" id="sumMonto">$0</div><div class="l">Total</div></div>
      <div class="divider"></div>
      <div class="stat"><div class="v" id="sumKm">–</div><div class="l">Km</div></div>
    </div>

    <div style="padding:6px 16px 0 16px;">
      <button class="btn-primary" onclick="iniciarRecorrido()">🚀 Iniciar recorrido</button>
    </div>

    <div class="ruta-toolbar">
      <button class="chip-btn" onclick="optimizarRuta()">🧭 Optimizar</button>
      <button class="chip-btn" onclick="abrirBuscadorParadas()">🔎 Buscar</button>
      <button class="chip-btn" onclick="abrirCierreDia()">🏁 Cerrar día</button>
    </div>

    <div id="stopSearchNote" class="search-hidden-note" style="display:none;"></div>
    <div class="stop-list" id="stopList"></div>

    <div class="fab-bar"><div class="inner">
      <button class="btn-primary" onclick="abrirAgregarParada()">＋ Añadir parada</button>
    </div></div>
  </div>

  <!-- ===================== PARADA: VISTA / EDICIÓN ===================== -->
  <div class="view" id="view-parada">
    <div class="topbar">
      <button class="back" onclick="volverDeParada()">←</button>
      <div style="flex:1">
        <h1 id="paradaTitulo" style="font-size:16px;">Parada</h1>
        <div class="sub" id="paradaSubtitulo"></div>
      </div>
      <button class="icon-btn" id="paradaEditToggle" onclick="toggleEdicionParada()">✎</button>
    </div>
    <div id="paradaContenido"></div>
  </div>

  <!-- ===================== HISTORIAL / EXPORTAR ===================== -->
  <div class="view" id="view-historial">
    <div class="topbar">
      <button class="back" onclick="goView('view-home')">←</button>
      <h1>Historial</h1>
    </div>
    <div class="search-row">
      <div class="search-box">
        <span class="ic">🔎</span>
        <input id="histSearch" placeholder="Buscar cliente en el historial..." oninput="renderHistorial()">
      </div>
    </div>
    <div id="histResumenGlobal" class="ruta-summary" style="margin-top:8px;"></div>
    <div id="histList"></div>
  </div>

  <!-- ===================== LOCALES Y CLIENTES ===================== -->
  <div class="view" id="view-agenda">
    <div class="topbar">
      <button class="back" onclick="goView('view-home')">←</button>
      <h1>Locales y clientes</h1>
      <button class="icon-btn" onclick="abrirImportar()">⬇︎</button>
    </div>
    <div class="segtabs">
      <button id="tabLocales" class="on" onclick="setAgendaTab('locales')">📦 Locales</button>
      <button id="tabClientes" onclick="setAgendaTab('clientes')">👤 Clientes</button>
    </div>
    <div class="search-row">
      <div class="search-box">
        <span class="ic">🔎</span>
        <input id="agendaSearch" placeholder="Buscar..." oninput="renderAgenda()">
      </div>
    </div>
    <div id="agendaSeedRow"></div>
    <div class="chips-wrap" id="agendaList"></div>
    <div class="fab-bar"><div class="inner">
      <button class="btn-primary" id="agendaAddBtn" onclick="abrirNuevoLocal()">＋ Nuevo local</button>
    </div></div>
  </div>

</div>

<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="sheet" id="sheetContent"></div></div>

<script>
/* =====================================================================
   MI RUTA — COMISIONES MAURI · reconstrucción completa
   Almacenamiento: localStorage (namespace mr2_*)
   ===================================================================== */

const LS_RUTAS = 'mr2_rutas';
const LS_LOCALES = 'mr2_locales';
const LS_CLIENTES = 'mr2_clientes';

let rutas = JSON.parse(localStorage.getItem(LS_RUTAS) || '{}');
let locales = JSON.parse(localStorage.getItem(LS_LOCALES) || '[]');
let clientes = JSON.parse(localStorage.getItem(LS_CLIENTES) || '[]');

let currentRutaId = null;   // fecha 'YYYY-MM-DD'
let currentParadaId = null;
let paradaEditMode = false;
let agendaTab = 'locales';

function saveRutas(){ localStorage.setItem(LS_RUTAS, JSON.stringify(rutas)); }
function saveLocales(){ localStorage.setItem(LS_LOCALES, JSON.stringify(locales)); }
function saveClientes(){ localStorage.setItem(LS_CLIENTES, JSON.stringify(clientes)); }

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function money(n){ n = Number(n)||0; return '$' + n.toLocaleString('es-AR'); }
function todayStr(){ const d = new Date(); return d.toISOString().slice(0,10); }
function fmtFechaCorta(iso){
  const [y,m,d] = iso.split('-');
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return { d, m: meses[parseInt(m,10)-1] };
}
function fmtFechaLarga(iso){
  const dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const dt = new Date(iso+'T12:00:00');
  return `${dias[dt.getDay()]} ${dt.getDate()} de ${meses[dt.getMonth()]}`;
}
function fmtHora(ts){
  if(!ts) return '';
  const d = new Date(ts);
  return d.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'});
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._tm);
  toast._tm = setTimeout(()=> t.classList.remove('show'), 2200);
}

function goView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='view-home') renderHome();
  if(id==='view-historial') renderHistorial();
  if(id==='view-agenda') renderAgenda();
  window.scrollTo(0,0);
}

/* ============================ MODALES / SHEETS ============================ */
function openSheet(html, opts){
  opts = opts||{};
  const ov = document.getElementById('overlay');
  const sc = document.getElementById('sheetContent');
  sc.className = 'sheet' + (opts.center ? ' center-box' : '');
  ov.className = 'overlay active' + (opts.center ? ' center' : '');
  sc.innerHTML = (opts.center ? '' : '<div class="handle"></div>') + html;
  ov.onclick = (e)=>{ if(e.target===ov && opts.dismissible!==false) closeSheet(); };
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('active');
}
function confirmDialog(title, msg, okLabel, onOk, danger){
  openSheet(`
    <h3>${title}</h3>
    <p style="color:var(--ink-soft);font-size:14px;line-height:1.5;margin-bottom:18px;">${msg}</p>
    <div class="row-2">
      <button class="btn-secondary" onclick="closeSheet()">Cancelar</button>
      <button class="${danger?'btn-danger-outline':'btn-primary'}" onclick="(${onOk.toString()})();closeSheet();">${okLabel}</button>
    </div>
  `, {center:true});
}

/* ============================ HOME: LISTADO DE RUTAS ============================ */
function crearRuta(){
  const fecha = todayStr();
  openSheet(`
    <h3>Nueva ruta</h3>
    <div class="field-label">Fecha</div>
    <input class="input" type="date" id="newRutaFecha" value="${fecha}">
    <div class="field-label">Nombre (opcional)</div>
    <input class="input" id="newRutaNombre" placeholder="Ej: Ruta mañana, Ruta 2...">
    <div style="height:16px;"></div>
    <button class="btn-primary" onclick="confirmarCrearRuta()">Crear ruta</button>
  `);
}
function confirmarCrearRuta(){
  const fecha = document.getElementById('newRutaFecha').value || todayStr();
  const nombre = document.getElementById('newRutaNombre').value.trim();
  if(!rutas[fecha]){
    rutas[fecha] = { fecha, nombre:'', paradas:[], combustible:[], kmInicio:null, kmFinal:null, puntoPartida:{tipo:'actual',direccion:''}, estado:'planificada', creadoEn:Date.now() };
  }
  if(nombre) rutas[fecha].nombre = nombre;
  saveRutas();
  closeSheet();
  abrirRuta(fecha);
}
function abrirRuta(fecha){
  currentRutaId = fecha;
  renderRuta();
  goView('view-ruta');
}
function eliminarRuta(fecha){
  confirmDialog('Eliminar ruta', `¿Eliminar la ruta del ${fmtFechaLarga(fecha)} con todas sus paradas? Esta acción no se puede deshacer.`, 'Eliminar', ()=>{
    delete rutas[fecha]; saveRutas(); renderHome();
  }, true);
}
function duplicarRutaComoNueva(fecha){
  openSheet(`
    <h3>Duplicar ruta a otro día</h3>
    <div class="field-label">Nueva fecha</div>
    <input class="input" type="date" id="dupFecha" value="${todayStr()}">
    <div style="height:16px;"></div>
    <button class="btn-primary" onclick="confirmarDuplicar('${fecha}')">Duplicar paradas</button>
  `);
}
function confirmarDuplicar(fechaOrig){
  const nueva = document.getElementById('dupFecha').value;
  if(!nueva) return;
  const orig = rutas[fechaOrig];
  if(!rutas[nueva]) rutas[nueva] = { fecha:nueva, nombre:'', paradas:[], combustible:[], kmInicio:null, kmFinal:null, puntoPartida:{tipo:'actual',direccion:''}, estado:'planificada', creadoEn:Date.now() };
  const copiadas = orig.paradas.map(p=>({ ...p, id:uid(), estado:'pendiente', horarios:{navegar:null,accion:null}, motivoFallida:'', fotosFallida:[] }));
  rutas[nueva].paradas = rutas[nueva].paradas.concat(copiadas);
  saveRutas();
  closeSheet();
  toast('Ruta duplicada');
  abrirRuta(nueva);
}
function abrirMenuRuta(){
  const r = rutas[currentRutaId];
  openSheet(`
    <h3>${fmtFechaLarga(currentRutaId)}</h3>
    <div class="field-label">Nombre de la ruta</div>
    <input class="input" id="editRutaNombre" value="${(r.nombre||'').replace(/"/g,'&quot;')}" placeholder="Ej: Ruta mañana">
    <div style="height:10px;"></div>
    <button class="btn-secondary" onclick="guardarNombreRuta()" style="margin-bottom:10px;">💾 Guardar nombre</button>
    <button class="btn-secondary" onclick="closeSheet();duplicarRutaComoNueva('${currentRutaId}')" style="margin-bottom:10px;">🗓️ Duplicar a otro día</button>
    <button class="btn-secondary" onclick="closeSheet();abrirExportar('${currentRutaId}')" style="margin-bottom:10px;">📤 Compartir / exportar a planilla</button>
    <button class="btn-secondary" onclick="closeSheet();marcarRutaCompletada()" style="margin-bottom:10px;">✅ Marcar ruta como completada</button>
    <button class="btn-danger-outline" onclick="closeSheet();eliminarRuta('${currentRutaId}');goView('view-home')">🗑️ Eliminar ruta</button>
  `);
}
function guardarNombreRuta(){
  rutas[currentRutaId].nombre = document.getElementById('editRutaNombre').value.trim();
  saveRutas(); closeSheet(); renderRuta();
}

/* --- Iniciar recorrido: arma el link de Google Maps con todas las paradas en orden --- */
function normalizarDireccion(dir){
  dir = (dir||'').trim();
  if(!dir) return dir;
  const yaTieneContexto = /rosario|casilda|santa fe|argentina|buenos aires|c[oó]rdoba,|venado tuerto|firmat|ca[nñ]ada de g[oó]mez/i.test(dir);
  if(yaTieneContexto) return dir;
  return dir + ', Rosario, Argentina';
}

/* --- Iniciar recorrido: arma tramos de hasta 10 paradas para Google Maps (límite de Maps) ---
   Los tramos se calculan sobre el orden fijo de TODAS las paradas de la ruta (bloques de 10),
   no solo las pendientes, para que el número de tramo no se recalcule cuando algunas se completan. */
function tramosDeRuta(r){
  const tramos = [];
  for(let i=0;i<r.paradas.length;i+=10) tramos.push(r.paradas.slice(i,i+10));
  return tramos;
}
function pendientesDeTramo(tramo){
  return tramo.filter(p=>p.estado==='pendiente');
}
function iniciarRecorrido(){
  const r = rutas[currentRutaId];
  if(!r.paradas.length){ toast('Todavía no cargaste ninguna parada'); return; }
  const pp = r.puntoPartida || {tipo:'actual', direccion:''};
  const tramos = tramosDeRuta(r);
  r.tramoActual = r.tramoActual || 0;
  // saltar al primer tramo (desde el actual) que todavía tenga paradas pendientes
  while(r.tramoActual < tramos.length && pendientesDeTramo(tramos[r.tramoActual]).length===0) r.tramoActual++;
  if(r.tramoActual >= tramos.length){ toast('No quedan paradas pendientes'); return; }
  const tramoPend = pendientesDeTramo(tramos[r.tramoActual]);
  openSheet(`
    <h3>Iniciar recorrido</h3>
    <div class="field-label">Punto de partida</div>
    <div class="seg" id="segPuntoPartida">
      <button class="${pp.tipo==='actual'?'on':''}" onclick="setPuntoPartidaTipo('actual',this)">📍 Mi ubicación actual</button>
      <button class="${pp.tipo==='fijo'?'on':''}" onclick="setPuntoPartidaTipo('fijo',this)">🏠 Dirección fija</button>
    </div>
    <div id="puntoPartidaDirWrap" style="${pp.tipo==='fijo'?'':'display:none;'}margin-top:10px;">
      <input class="input" id="puntoPartidaDir" placeholder="🎤 Dirección de partida" value="${(pp.direccion||'').replace(/"/g,'&quot;')}">
    </div>
    <p style="font-size:12.5px;color:var(--ink-soft);margin-top:14px;">
      ${tramos.length>1
        ? `Tenés ${tramos.length} tramos de hasta 10 paradas (límite de Google Maps por viaje). Se abre el tramo ${r.tramoActual+1} de ${tramos.length} ahora (${tramoPend.length} pendientes); cuando marques todas sus paradas, la app habilita solo el siguiente tramo.`
        : `Se va a abrir Google Maps con las ${tramoPend.length} paradas pendientes en el orden actual de la lista, como escalas de la ruta.`}
    </p>
    <div style="height:6px;"></div>
    <button class="btn-primary" onclick="confirmarIniciarRecorrido()">Abrir Tramo ${r.tramoActual+1}${tramos.length>1?(' de '+tramos.length):''} en Google Maps</button>
  `);
}
function setPuntoPartidaTipo(tipo, btn){
  const r = rutas[currentRutaId];
  r.puntoPartida = r.puntoPartida || {tipo:'actual', direccion:''};
  r.puntoPartida.tipo = tipo;
  saveRutas();
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('puntoPartidaDirWrap').style.display = tipo==='fijo' ? '' : 'none';
}
function confirmarIniciarRecorrido(){
  const r = rutas[currentRutaId];
  r.puntoPartida = r.puntoPartida || {tipo:'actual', direccion:''};
  if(r.puntoPartida.tipo==='fijo'){
    r.puntoPartida.direccion = document.getElementById('puntoPartidaDir').value.trim();
  }
  const tramos = tramosDeRuta(r);
  r.tramoActual = r.tramoActual || 0;
  while(r.tramoActual < tramos.length && pendientesDeTramo(tramos[r.tramoActual]).length===0) r.tramoActual++;
  if(r.tramoActual >= tramos.length){ toast('No quedan paradas pendientes'); closeSheet(); return; }
  const tramoPend = pendientesDeTramo(tramos[r.tramoActual]);
  const esPrimerTramo = r.tramoActual === 0;
  const direcciones = tramoPend.map(p=> normalizarDireccion(p.direccion || p.nombre));
  const destino = direcciones[direcciones.length-1];
  const escalas = direcciones.slice(0,-1);
  let url = 'https://www.google.com/maps/dir/?api=1';
  if(esPrimerTramo && r.puntoPartida.tipo==='fijo' && r.puntoPartida.direccion){
    url += '&origin=' + encodeURIComponent(normalizarDireccion(r.puntoPartida.direccion));
  } else if(!esPrimerTramo){
    // arranca desde la última parada (completada) del tramo anterior con datos
    const anterior = tramos[r.tramoActual-1];
    const ultimaAnterior = anterior[anterior.length-1];
    if(ultimaAnterior){
      url += '&origin=' + encodeURIComponent(normalizarDireccion(ultimaAnterior.direccion || ultimaAnterior.nombre));
    }
  }
  url += '&destination=' + encodeURIComponent(destino);
  if(escalas.length) url += '&waypoints=' + escalas.map(encodeURIComponent).join('|');
  url += '&travelmode=driving';
  saveRutas();
  window.open(url, '_blank');
  closeSheet();
}
function avanzarTramoSiCorresponde(){
  const r = rutas[currentRutaId];
  if(!r) return;
  const tramos = tramosDeRuta(r);
  r.tramoActual = r.tramoActual || 0;
  const actual = tramos[r.tramoActual];
  if(actual && pendientesDeTramo(actual).length===0 && r.tramoActual < tramos.length-1){
    r.tramoActual++;
    saveRutas();
    toast('Tramo completo. Habilitado el tramo ' + (r.tramoActual+1) + ' de ' + tramos.length);
  } else {
    saveRutas();
  }
}

function marcarRutaCompletada(){
  const r = rutas[currentRutaId];
  const pendientes = r.paradas.filter(p=>p.estado==='pendiente');
  if(pendientes.length){
    confirmDialog('Paradas sin marcar', `Tenés ${pendientes.length} parada(s) sin marcar como completada, fallida, entregada o recogida. ¿Marcar la ruta como completada igual?`, 'Marcar igual', ()=>{
      r.estado='completada'; saveRutas(); renderRuta(); toast('Ruta marcada como completada');
    });
  } else {
    r.estado='completada'; saveRutas(); renderRuta(); toast('Ruta marcada como completada');
  }
}

function renderHome(){
  const term = (document.getElementById('homeSearch').value||'').toLowerCase().trim();
  const fechas = Object.keys(rutas).sort((a,b)=> b.localeCompare(a));
  const list = document.getElementById('homeList');
  if(!fechas.length){
    list.innerHTML = `<div class="empty-state"><div class="em">🗺️</div><div class="t">Todavía no armaste ninguna ruta</div><div class="s">Tocá "Crear ruta" para planificar tu primer recorrido de entregas y comisiones.</div></div>`;
    return;
  }
  const now = new Date();
  const startWeek = new Date(now); startWeek.setDate(now.getDate() - now.getDay());
  const startMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  let html = '';
  let lastGroup = null;
  let anyShown = false;
  fechas.forEach(f=>{
    const r = rutas[f];
    const nombreLower = (r.nombre||'').toLowerCase();
    if(term && !f.includes(term) && !nombreLower.includes(term)) return;
    anyShown = true;
    const dt = new Date(f+'T12:00:00');
    let group;
    if(dt >= startWeek) group = 'Esta semana';
    else if(dt >= startMonth) group = 'Este mes';
    else group = 'Anteriores';
    if(group !== lastGroup){ html += `<div class="group-label">${group}</div>`; lastGroup = group; }
    const {d,m} = fmtFechaCorta(f);
    const totalMonto = r.paradas.reduce((s,p)=> s + (Number(p.precio)||0), 0);
    const dias = ['dom','lun','mar','mié','jue','vie','sáb'];
    html += `
      <div class="route-row" onclick="abrirRuta('${f}')">
        <div class="date-badge"><div class="d">${d}</div><div class="m">${m}</div></div>
        <div class="info">
          <div class="name">${r.nombre ? r.nombre : (dias[dt.getDay()][0].toUpperCase()+dias[dt.getDay()].slice(1))}</div>
          <div class="meta">
            <span class="badge-estado ${r.estado==='completada'?'badge-done':'badge-plan'}">${r.estado==='completada'?'Completada':'Planificada'}</span>
            <span>${r.paradas.length} parada${r.paradas.length===1?'':'s'}</span>
            ${totalMonto? `<span>${money(totalMonto)}</span>` : ''}
          </div>
        </div>
        <div class="chevron">›</div>
      </div>`;
  });
  if(!anyShown){
    html = `<div class="empty-state"><div class="em">🔎</div><div class="t">Sin resultados</div><div class="s">No encontramos ninguna ruta que coincida con la búsqueda.</div></div>`;
  }
  list.innerHTML = html;
}

/* ============================ RUTA: LISTA DE PARADAS ============================ */
let stopSearchTerm = '';
function renderRuta(){
  const r = rutas[currentRutaId];
  if(!r){ goView('view-home'); return; }
  document.getElementById('rutaTitulo').textContent = r.nombre || fmtFechaLarga(currentRutaId);
  document.getElementById('rutaSubtitulo').textContent = (r.nombre ? fmtFechaLarga(currentRutaId) : '') + (r.estado==='completada' ? (r.nombre? ' · Completada' : 'Completada') : '');

  const totalMonto = r.paradas.reduce((s,p)=> s + (Number(p.precio)||0), 0);
  document.getElementById('sumParadas').textContent = r.paradas.length;
  document.getElementById('sumMonto').textContent = money(totalMonto);
  const km = (r.kmInicio!=null && r.kmFinal!=null) ? Math.max(0, r.kmFinal - r.kmInicio) : null;
  document.getElementById('sumKm').textContent = km!=null ? km : '–';

  const listEl = document.getElementById('stopList');
  const note = document.getElementById('stopSearchNote');
  let paradas = r.paradas;
  if(stopSearchTerm.trim()){
    const t = stopSearchTerm.toLowerCase();
    paradas = paradas.filter(p => (p.nombre||'').toLowerCase().includes(t) || (p.direccion||'').toLowerCase().includes(t) || (p.clienteNombre||'').toLowerCase().includes(t));
    note.style.display='block';
    note.textContent = `Mostrando ${paradas.length} de ${r.paradas.length} · reordenar deshabilitado durante la búsqueda`;
  } else {
    note.style.display='none';
  }

  if(!paradas.length){
    listEl.innerHTML = `<div class="empty-state"><div class="em">📦</div><div class="t">${stopSearchTerm.trim()?'Sin resultados':'Sin paradas todavía'}</div><div class="s">${stopSearchTerm.trim()?'':'Tocá "Añadir parada" para empezar a cargar la ruta.'}</div></div>`;
    return;
  }

  listEl.innerHTML = paradas.map((p, idx)=>{
    const realIdx = r.paradas.indexOf(p);
    const tags = [];
    if(p.tipoEntrega) tags.push(`<span class="tag entrega">↧ Entrega</span>`);
    if(p.tipoRecogida) tags.push(`<span class="tag recogida">↥ Recogida</span>`);
    if(p.tamano) tags.push(`<span class="tag">${p.tamano}</span>`);
    if(p.tipoPaquete) tags.push(`<span class="tag">${p.tipoPaquete}</span>`);
    if(p.cantidadPaquetes>1) tags.push(`<span class="tag">×${p.cantidadPaquetes}</span>`);
    if(p.precio) tags.push(`<span class="tag precio">${money(p.precio)}</span>`);
    if(p.horaDesde) tags.push(`<span class="tag">🕒 ${p.horaDesde}${p.horaHasta?'–'+p.horaHasta:''}</span>`);
    const stateClass = p.estado==='completada' ? 'completada' : (p.estado==='fallida' ? 'fallida' : '');
    const numDisplay = p.estado==='completada' ? '✓' : (p.estado==='fallida' ? '✕' : (realIdx+1));
    return `
      <div class="stop ${stateClass}" data-id="${p.id}" onclick="abrirParada('${p.id}')">
        <div class="order-col">
          <div class="order-num">${numDisplay}</div>
          ${realIdx < r.paradas.length-1 ? '<div class="route-line"></div>' : ''}
        </div>
        <div class="body">
          <div class="title-row">
            <div class="title">${p.nombre || 'Parada sin nombre'}</div>
          </div>
          <div class="addr">${p.direccion||''}</div>
          <div class="tags">${tags.join('')}</div>
          ${p.horarios && p.horarios.accion ? `<div class="time-est">Realizado a las ${fmtHora(p.horarios.accion)}</div>` : ''}
        </div>
        <button class="drag-handle" data-id="${p.id}" onclick="event.stopPropagation()">⠿</button>
      </div>`;
  }).join('');
}
function abrirBuscadorParadas(){
  openSheet(`
    <h3>Buscar parada</h3>
    <input class="input" id="stopSearchInput" placeholder="Nombre, dirección o cliente..." value="${stopSearchTerm}" oninput="stopSearchTerm=this.value; renderRuta();">
    <div style="height:12px;"></div>
    <button class="btn-secondary" onclick="stopSearchTerm='';document.getElementById('stopSearchInput').value='';renderRuta();closeSheet();">Limpiar búsqueda</button>
  `);
  setTimeout(()=>document.getElementById('stopSearchInput').focus(), 200);
}

/* --- Drag & drop (pointer events) --- */
document.addEventListener('DOMContentLoaded', ()=>{
  const listEl = document.getElementById('stopList');
  listEl.addEventListener('pointerdown', (e)=>{
    if(stopSearchTerm.trim()) return;
    const handle = e.target.closest('.drag-handle');
    if(!handle) return;
    e.preventDefault();
    const stopEl = handle.closest('.stop');
    if(!stopEl) return;
    const startY = e.clientY;
    stopEl.classList.add('dragging');
    try{ handle.setPointerCapture(e.pointerId); }catch(err){}
    function onMove(ev){
      const dy = ev.clientY - startY;
      stopEl.style.transform = `translateY(${dy}px)`;
      const items = Array.from(listEl.children).filter(el=>el.classList.contains('stop'));
      const draggedRect = stopEl.getBoundingClientRect();
      const draggedMid = draggedRect.top + draggedRect.height/2;
      for(const item of items){
        if(item===stopEl) continue;
        const r = item.getBoundingClientRect();
        const mid = r.top + r.height/2;
        const stopIsBefore = !!(stopEl.compareDocumentPosition(item) & Node.DOCUMENT_POSITION_FOLLOWING);
        if(stopIsBefore && draggedMid > mid){ listEl.insertBefore(item, stopEl); }
        else if(!stopIsBefore && draggedMid < mid){ listEl.insertBefore(stopEl, item); }
      }
    }
    function onUp(ev){
      stopEl.classList.remove('dragging');
      stopEl.style.transform = '';
      try{ handle.releasePointerCapture(ev.pointerId); }catch(err){}
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      const newOrder = Array.from(listEl.children).filter(el=>el.classList.contains('stop')).map(el=>el.dataset.id);
      const r = rutas[currentRutaId];
      r.paradas.sort((a,b)=> newOrder.indexOf(a.id) - newOrder.indexOf(b.id));
      saveRutas();
      renderRuta();
    }
    window.addEventListener('pointermove', onMove);

/* --- Optimización automática por localidad (evita zigzag) --- */
function optimizarRuta(){
  const r = rutas[currentRutaId];
  if(r.paradas.length < 2){ toast('Necesitás al menos 2 paradas para optimizar'); return; }
  const primero = r.paradas.filter(p=>p.orden==='primero');
  const ultimo = r.paradas.filter(p=>p.orden==='ultimo');
  const normal = r.paradas.filter(p=>p.orden!=='primero' && p.orden!=='ultimo');

  // Agrupar por localidad manteniendo el orden de aparición de cada grupo (estable),
  // así evita el zigzag Rosario→Casilda→Rosario. Dentro de cada localidad,
  // las paradas con horario límite (horaDesde) se acomodan antes según esa hora.
  const gruposOrden = [];
  const grupos = {};
  normal.forEach(p=>{
    const loc = (p.localidad||'Rosario').trim() || 'Rosario';
    if(!grupos[loc]){ grupos[loc]=[]; gruposOrden.push(loc); }
    grupos[loc].push(p);
  });
  const normalOrdenado = [];
  gruposOrden.forEach(loc=>{
    const g = grupos[loc].slice();
    g.sort((a,b)=>{
      if(a.horaDesde && b.horaDesde) return a.horaDesde.localeCompare(b.horaDesde);
      if(a.horaDesde) return -1;
      if(b.horaDesde) return 1;
      return 0;
    });
    normalOrdenado.push(...g);
  });

  r.paradas = [...primero, ...normalOrdenado, ...ultimo];
  saveRutas();
  renderRuta();
  toast('Ruta reordenada agrupando por localidad — podés ajustar a mano arrastrando ⠿');
}

/* --- Cierre de día: combustible + km + resumen --- */
function abrirCierreDia(){
  const r = rutas[currentRutaId];
  const totalComb = (r.combustible||[]).reduce((s,c)=> s+(Number(c.monto)||0), 0);
  const fuelListHtml = (r.combustible||[]).map((c,i)=>`
    <div class="fuel-item"><span>${money(c.monto)} · ${fmtHora(c.hora)}</span><button onclick="quitarCombustible(${i})">✕</button></div>
  `).join('');
  openSheet(`
    <h3>Cerrar día</h3>
    <div class="field-label">Cargas de combustible</div>
    ${fuelListHtml || '<div class="helper-txt">Todavía no cargaste combustible hoy.</div>'}
    <div class="row-2" style="margin-top:8px;">
      <input class="input" id="fuelMonto" type="number" inputmode="decimal" placeholder="Monto $">
      <button class="btn-secondary" style="flex:0 0 90px;" onclick="agregarCombustible()">＋ Cargar</button>
    </div>
    <div style="font-size:12.5px;color:var(--ink-soft);margin-top:8px;">Total combustible: <b class="mono">${money(totalComb)}</b></div>

    <div class="field-label">Kilómetros</div>
    <div class="row-2">
      <div><div class="helper-txt" style="margin:0 0 4px 0;">Km inicial</div><input class="input" id="kmInicio" type="number" inputmode="numeric" value="${r.kmInicio ?? ''}"></div>
      <div><div class="helper-txt" style="margin:0 0 4px 0;">Km final</div><input class="input" id="kmFinal" type="number" inputmode="numeric" value="${r.kmFinal ?? ''}"></div>
    </div>

    <div style="height:8px;"></div>
    <button class="btn-primary" onclick="guardarCierreDia()">Guardar y ver resumen</button>
  `);

function agregarCombustible(){
  const v = parseFloat(document.getElementById('fuelMonto').value);
  if(!v || v<=0) return;
  const r = rutas[currentRutaId];
  r.combustible = r.combustible||[];
  r.combustible.push({ monto:v, hora:Date.now() });
  saveRutas();
  abrirCierreDia();
}
function quitarCombustible(i){
  const r = rutas[currentRutaId];
  r.combustible.splice(i,1);
  saveRutas();
  abrirCierreDia();
}
function guardarCierreDia(){
  const r = rutas[currentRutaId];
  const ki = document.getElementById('kmInicio').value;
  const kf = document.getElementById('kmFinal').value;
  r.kmInicio = ki===''? null : parseFloat(ki);
  r.kmFinal = kf===''? null : parseFloat(kf);
  saveRutas();
  closeSheet();
  renderRuta();
  mostrarResumenDia();
}
function mostrarResumenDia(){
  const r = rutas[currentRutaId];
  const accionadas = r.paradas.filter(p=>p.horarios && p.horarios.accion).sort((a,b)=>a.horarios.accion-b.horarios.accion);
  const pendientes = r.paradas.filter(p=>p.estado==='pendiente');
  let tiempoTotalTxt = '–';
  if(accionadas.length>=2){
    const ms = accionadas[accionadas.length-1].horarios.accion - accionadas[0].horarios.accion;
    const mins = Math.round(ms/60000);
    tiempoTotalTxt = `${Math.floor(mins/60)}h ${mins%60}m`;
  }
  const km = (r.kmInicio!=null && r.kmFinal!=null) ? Math.max(0, r.kmFinal-r.kmInicio) : null;
  const kmProm = (km!=null && r.paradas.length) ? (km/r.paradas.length).toFixed(1) : '–';
  const totalComb = (r.combustible||[]).reduce((s,c)=> s+(Number(c.monto)||0), 0);
  const totalMonto = r.paradas.reduce((s,p)=> s+(Number(p.precio)||0), 0);
  openSheet(`
    <h3>Resumen del día</h3>
    <div class="kv-row"><span class="k">Paradas realizadas</span><span class="mono">${r.paradas.length - pendientes.length} / ${r.paradas.length}</span></div>
    <div class="kv-row"><span class="k">Tiempo total en ruta</span><span class="mono">${tiempoTotalTxt}</span></div>
    <div class="kv-row"><span class="k">Kilómetros recorridos</span><span class="mono">${km!=null?km:'–'}</span></div>
    <div class="kv-row"><span class="k">Promedio km por parada</span><span class="mono">${kmProm}</span></div>
    <div class="kv-row"><span class="k">Gasto combustible</span><span class="mono">${money(totalComb)}</span></div>
    <div class="kv-row total"><span class="k">Total ingresos del día</span><span class="mono">${money(totalMonto)}</span></div>
    ${pendientes.length? `<div class="helper-txt" style="margin-top:12px;color:var(--danger);">⚠️ Tenés ${pendientes.length} parada(s) sin marcar todavía.</div>`:''}
    <div style="height:14px;"></div>
    <button class="btn-primary" onclick="closeSheet();abrirExportar('${currentRutaId}')">📤 Compartir a la planilla</button>
  `);
}

function agregarFoto(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      let w=img.width, h=img.height; const maxDim=900;
      if(w>maxDim||h>maxDim){ if(w>h){h=Math.round(h*maxDim/w);w=maxDim;} else {w=Math.round(w*maxDim/h);h=maxDim;} }
      const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.65);
      const p = getParada(currentParadaId);
      p.fotos = p.fotos||[];
      p.fotos.push(dataUrl);
      saveRutas();
      renderParada();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function agregarFotoFallida(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      let w=img.width, h=img.height; const maxDim=900;
      if(w>maxDim||h>maxDim){ if(w>h){h=Math.round(h*maxDim/w);w=maxDim;} else {w=Math.round(w*maxDim/h);h=maxDim;} }
      const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.65);
      const p = getParada(currentParadaId);
      p.fotosFallida = p.fotosFallida||[];
      p.fotosFallida.push(dataUrl);
      saveRutas();
      abrirFallida();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

  const p = getParada(currentParadaId);
  p.fotosFallida.splice(i,1);

}
function confirmarFallida(){
  const p = getParada(currentParadaId);

  p.estado = 'fallida';
  p.horarios.accion = Date.now();

  closeSheet();
  renderParada();
}

function procesarImportacion(){
  const txt = document.getElementById('importText').value;
  const lineas = txt.split('\n').map(l=>l.trim()).filter(Boolean);
  let count = 0;
  lineas.forEach(linea=>{
    const partes = linea.split('->').map(p=>p.trim());

    if(window.importDestino==='locales'){
      locales.push({ id:uid(), nombre:partes[0], direccion:partes[1]||'', localidad:'Rosario', telefono:partes[2]||'' });

    count++;
  });

  toast(`${count} importado(s)`);

/* ============================ HISTORIAL Y EXPORTAR A PLANILLA ============================ */
function renderHistorial(){
  const term = (document.getElementById('histSearch').value||'').toLowerCase().trim();
  const fechas = Object.keys(rutas).sort((a,b)=> b.localeCompare(a));
  let totalGlobal = 0, kmGlobal = 0, paradasGlobal = 0;
  fechas.forEach(f=>{
    const r = rutas[f];
    totalGlobal += r.paradas.reduce((s,p)=>s+(Number(p.precio)||0),0);
    paradasGlobal += r.paradas.length;
    if(r.kmInicio!=null && r.kmFinal!=null) kmGlobal += Math.max(0, r.kmFinal-r.kmInicio);
  });
  document.getElementById('histResumenGlobal').innerHTML = `
    <div class="stat"><div class="v">${paradasGlobal}</div><div class="l">Paradas</div></div>
    <div class="divider"></div>
    <div class="stat"><div class="v">${money(totalGlobal)}</div><div class="l">Total histórico</div></div>
    <div class="divider"></div>
    <div class="stat">${kmGlobal? kmGlobal : '–'}<div class="l">Km totales</div></div>
  `;

  let matches = [];
  if(term){
    fechas.forEach(f=>{
      rutas[f].paradas.forEach(p=>{
        const nombreMatch = (p.clienteNombre||p.nombre||'').toLowerCase();
        if(nombreMatch.includes(term)){
          matches.push({fecha:f, parada:p});
        }
      });
    });
  }

  const listEl = document.getElementById('histList');
  if(term){
    if(!matches.length){ listEl.innerHTML = `<div class="empty-state"><div class="em">🔎</div><div class="t">Sin coincidencias</div></div>`; return; }
    matches.sort((a,b)=> b.fecha.localeCompare(a.fecha));
    listEl.innerHTML = `<div class="group-label">Historial de "${term}"</div>` + matches.map(m=>`
      <div class="route-row" onclick="abrirRuta('${m.fecha}')">
        <div class="date-badge"><div class="d">${fmtFechaCorta(m.fecha).d}</div><div class="m">${fmtFechaCorta(m.fecha).m}</div></div>
        <div class="info">
          <div class="name">${m.parada.nombre||m.parada.clienteNombre}</div>
          <div class="meta"><span>${m.parada.direccion||''}</span>${m.parada.precio?`<span>${money(m.parada.precio)}</span>`:''}</div>
        </div>
        <div class="chevron">›</div>
      </div>`).join('');
  } else {
    listEl.innerHTML = fechas.length ? `<div class="group-label">Todas las rutas</div>` + fechas.map(f=>{
      const r = rutas[f];
      const total = r.paradas.reduce((s,p)=>s+(Number(p.precio)||0),0);
      return `<div class="route-row" onclick="abrirRuta('${f}')">
        <div class="date-badge"><div class="d">${fmtFechaCorta(f).d}</div><div class="m">${fmtFechaCorta(f).m}</div></div>
        <div class="info"><div class="name">${r.nombre||fmtFechaLarga(f)}</div><div class="meta"><span>${r.paradas.length} paradas</span><span>${money(total)}</span></div></div>
        <div class="chevron">›</div>
      </div>`;
    }).join('') : `<div class="empty-state"><div class="em">📊</div><div class="t">Sin historial todavía</div></div>`;
  }
}

  openSheet(`
    <h3>Exportar a la planilla</h3>
    <p style="font-size:12.5px;color:var(--ink-soft);">Formato listo para pegar en Sheets: Mes · Fecha · Cliente · Dirección · Monto · Estado · Tipo de cliente · Notas (con los horarios de cada acción incluidos en Notas).</p>
    <textarea id="exportOut" readonly>${texto}</textarea>
    <div style="height:12px;"></div>
    <div class="row-2">
      <button class="btn-secondary" onclick="copiarExport()">📋 Copiar</button>
      <a class="btn-primary" style="text-decoration:none;" target="_blank" href="https://wa.me/?text=${encodeURIComponent(texto)}">💬 WhatsApp</a>
    </div>
  `);
}
function generarTextoExport(r, fecha){
  const meses = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
  const [y,m,d] = fecha.split('-');
  const mesNombre = meses[parseInt(m,10)-1];
  const fechaFmt = `${d}/${m}/${y}`;
  return r.paradas.map(p=>{
    const cliente = p.clienteNombre || p.nombre || '';
    const direccion = p.direccion || '';
    const monto = p.precio || 0;
    const estado = p.estado==='fallida' ? 'FALLIDA' : (p.estado==='completada' ? 'PAGADO' : 'PENDIENTE');
    const tipoCliente = p.clienteTipo || '';
    let notas = p.notas || '';
    const horarios = [];
    if(p.horarios.navegar) horarios.push(`navegó ${fmtHora(p.horarios.navegar)}`);
    if(p.horarios.accion) horarios.push(`${p.estado==='fallida'?'fallida':'completada'} ${fmtHora(p.horarios.accion)}`);
    if(p.motivoFallida) horarios.push(`motivo: ${p.motivoFallida}`);
    if(horarios.length) notas = (notas ? notas + ' — ' : '') + horarios.join(', ');
    return [mesNombre, fechaFmt, cliente, direccion, monto, estado, tipoCliente, notas].join('\t');
  }).join('\n');
}
function copiarExport(){
  const ta = document.getElementById('exportOut');
  ta.removeAttribute('readonly');
  ta.select();
  document.execCommand('copy');
  ta.setAttribute('readonly', 'true');
  toast('Copiado al portapapeles');
}

/* ============================ INICIO ============================ */
renderHome();
</script>
